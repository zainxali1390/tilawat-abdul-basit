  function installHelp() {
    const standalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone;
    if (standalone) return `<p class="set-note">${t('installDone')}</p>`;
    if (AB.pwa && AB.pwa.canInstall()) return `<p class="set-note">${t('installNote')}</p><div><button class="btn primary" data-act="install">${icon('install')}<span>${t('install')}</span></button></div>`;
    if (location.protocol === 'file:') return `<p class="set-note">${t('installFile')}</p>`;
    return `<p class="set-note">${t('installManual')}</p>`;
  }
  function toggleRow(pref, label, note) {
    const on = !!S.prefs.get(pref);
    return `<div class="set-row"><span class="set-label">${esc(label)}${note ? `<small>${esc(note)}</small>` : ''}</span>
      <button class="switch" role="switch" aria-checked="${on}" data-act="togglePref" data-pref="${pref}" aria-label="${esc(label)}"><span></span></button></div>`;
  }
  function applyAppearance() {
    const root = document.documentElement;
    root.dataset.theme = S.prefs.get('theme');
    root.style.setProperty('--qfont', `'${S.prefs.get('quranFont')}', 'Amiri Quran', 'Amiri', 'Noto Naskh Arabic', serif`);
    root.style.setProperty('--qsize', S.prefs.get('fontSize') + 'px');
    const dark = root.dataset.theme === 'dark' || (root.dataset.theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
    $$('meta[name=theme-color]').forEach(m => m.setAttribute('content', dark ? '#101614' : '#F2F4F3'));
  }

  // ---- Player UI ----------------------------------------------------------------------------
  function buildChrome() {
    $('#backBtn').innerHTML = icon('back');
    $('#backBtn').setAttribute('aria-label', t('back'));
    $('#tabbar').innerHTML = [['quran', '#/', 'book', t('tabQuran')], ['library', '#/library', 'headphones', t('tabLibrary')], ['saved', '#/saved', 'bookmark', t('tabSaved')], ['settings', '#/settings', 'sliders', t('tabSettings')]]
      .map(([k, h, ic, l]) => `<a class="tab" data-tab="${k}" href="${h}">${icon(ic)}<span>${l}</span></a>`).join('');
    $('#mini').innerHTML = `<div class="mini-progress"><span id="miniBar"></span></div>
      <button class="mini-main" data-act="openSheet" aria-label="${t('openPlayer')}"><span class="mini-title" id="miniTitle" dir="auto"></span><span class="mini-sub" id="miniSub" dir="auto"></span></button>
      <button class="icon-btn" data-act="togglePlay" id="miniPlay" aria-label="${t('play')}">${icon('play')}</button>
      <button class="icon-btn" data-act="nextTrack" aria-label="${t('next')}">${icon('next')}</button>`;
    $('#sheet').innerHTML = `<div class="sheet-inner">
      <div class="sheet-top"><button class="icon-btn" data-act="closeSheet" aria-label="${t('close')}">${icon('chevDown')}</button><span class="sheet-label">${t('nowPlaying')}</span><button class="icon-btn" data-act="openText" aria-label="${t('readText')}">${icon('book')}</button></div>
      <div class="np-main">
        <div class="np-title" id="npTitle" dir="auto"></div>
        <div class="np-sub" id="npSub" dir="auto"></div>
        <div class="np-ayah" id="npAyah" lang="ar" dir="rtl"></div>
        <div class="np-tr" id="npTr"></div>
      </div>
      <div class="np-seek"><input type="range" id="npSeek" min="0" max="1" step="1" value="0" aria-label="${t('position')}">
        <div class="np-times"><span id="npCur"></span><span id="npDur"></span></div></div>
      <div class="np-controls">
        <button class="icon-btn lg" data-act="prevTrack" aria-label="${t('previous')}">${icon('prev')}</button>
        <button class="icon-btn lg" data-act="seekBack" id="npBack">${icon('rewind')}</button>
        <button class="play-big" data-act="togglePlay" id="npPlay" aria-label="${t('play')}">${icon('play')}</button>
        <button class="icon-btn lg" data-act="seekFwd" id="npFwd">${icon('forward')}</button>
        <button class="icon-btn lg" data-act="nextTrack" aria-label="${t('next')}">${icon('next')}</button>
      </div>
      <div class="np-options">
        <button class="opt" data-act="cycleRepeat" id="npRepeat">${icon('repeat')}<span></span></button>
        <button class="opt" data-act="speedMenu" id="npSpeed">${icon('speed')}<span></span></button>
        <button class="opt" data-act="sleepMenu" id="npSleep">${icon('sleep')}<span></span></button>
        <button class="opt verse-only" data-act="ayahRepeatMenu" id="npAyahRep">${icon('ayah')}<span></span></button>
        <button class="opt verse-only" data-act="rangeMenu" id="npRange">${icon('range')}<span></span></button>
      </div>
      <div class="np-queue" id="npQueue"></div>
    </div>`;
    $('#npSeek').addEventListener('input', e => { seeking = true; showSeekLabel(+e.target.value); });
    $('#npSeek').addEventListener('change', e => { seeking = false; P.seekTo(+e.target.value); });
  }
  let seeking = false;
  function showSeekLabel(v) {
    const s = P.state();
    $('#npCur').textContent = s.verses ? ayahPosLabel(s.track.segments[v]) : fmtTime(v);
  }
  function ayahPosLabel(seg) { return seg ? (seg.basmala ? t('basmala') : t('ayahShort', { k: num(seg.s) + ':' + num(seg.a) })) : ''; }

  function updatePlayerUI() {
    const s = P.state();
    const has = !!s.track || s.loading;
    $('#mini').hidden = !has;
    document.body.classList.toggle('has-mini', has);
    if (!has) return;
    const playing = s.wanted;
    const pIcon = s.loading && s.wanted ? '<span class="spinner" aria-hidden="true"></span>' : icon(playing ? 'pause' : 'play');
    $('#miniPlay').innerHTML = pIcon; $('#miniPlay').setAttribute('aria-label', playing ? t('pause') : t('play'));
    $('#npPlay').innerHTML = pIcon; $('#npPlay').setAttribute('aria-label', playing ? t('pause') : t('play'));
    if (s.track) {
      $('#miniTitle').textContent = s.track.title + (s.segment && !s.segment.basmala ? ' · ' + num(s.segment.s) + ':' + num(s.segment.a) : '');
      $('#miniSub').textContent = s.error ? s.error : s.track.subtitle;
      $('#npTitle').textContent = s.track.title;
      $('#npSub').textContent = s.track.subtitle;
    } else { $('#miniTitle').textContent = t('loading'); $('#miniSub').textContent = ''; }
    const rep = s.repeat;
    $('#npRepeat span').textContent = t('repeat_' + rep);
    $('#npRepeat').classList.toggle('is-on', rep !== 'off');
    $('#npSpeed span').textContent = num(s.speed) + '×';
    $('#npSpeed').classList.toggle('is-on', s.speed !== 1);
    $('#npSleep span').textContent = s.sleepEnd ? t('sleepEnd') : s.sleepAt ? fmtTime((s.sleepAt - Date.now()) / 1000) : t('sleep');
    $('#npSleep').classList.toggle('is-on', !!(s.sleepAt || s.sleepEnd));
    $('#npAyahRep span').textContent = s.ayahRepeat === 1 ? t('ayahOnce') : s.ayahRepeat === 0 ? t('ayahLoop') : t('ayahTimes', { n: num(s.ayahRepeat) });
    $('#npAyahRep').classList.toggle('is-on', s.ayahRepeat !== 1);
    $('#npRange span').textContent = s.range ? t('rangeOn', { a: ayahPosLabel(s.track.segments[s.range[0]]), b: ayahPosLabel(s.track.segments[s.range[1]]) }) : t('repeatRange');
    $('#npRange').classList.toggle('is-on', !!s.range);
    $('#sheet').classList.toggle('verses', !!s.verses);
    $('#npBack').setAttribute('aria-label', s.verses ? t('prevAyah') : t('back10'));
    $('#npFwd').setAttribute('aria-label', s.verses ? t('nextAyah') : t('fwd10'));
    updateTime();
  }
  let timeRaf = 0;
  function updateTime() {
    if (timeRaf) return;
    timeRaf = requestAnimationFrame(() => {
      timeRaf = 0;
      const s = P.state();
      if (!s.track) return;
      const seek = $('#npSeek');
      let frac = 0;
      if (s.verses) {
        const n = s.track.segments.length;
        seek.max = String(n - 1); seek.step = '1';
        if (!seeking) { seek.value = String(s.seg); $('#npCur').textContent = ayahPosLabel(s.segment); }
        const last = s.track.segments[n - 1];
        $('#npDur').textContent = t('ayahsN', { n: num(s.track.segments.filter(x => !x.basmala).length) }) + (last ? '' : '');
        frac = n > 1 ? (s.seg + (s.duration ? s.time / s.duration : 0)) / n : (s.duration ? s.time / s.duration : 0);
      } else {
        seek.max = String(s.duration || 1); seek.step = 'any';
        if (!seeking) { seek.value = String(s.time); $('#npCur').textContent = fmtTime(s.time); }
        $('#npDur').textContent = s.duration ? fmtTime(s.duration) : '';
        frac = s.duration ? s.time / s.duration : 0;
      }
      $('#miniBar').style.width = (Math.min(1, frac) * 100).toFixed(2) + '%';
    });
  }
  async function updateSheetAyah() {
    const seg = P.state().segment;
    const ayEl = $('#npAyah'), trEl = $('#npTr');
    if (!seg) { ayEl.textContent = ''; trEl.textContent = ''; ayEl.hidden = true; trEl.hidden = true; return; }
    const key = seg.basmala ? null : seg.key;
    if (!key) { ayEl.hidden = false; ayEl.textContent = Q.BASMALA; trEl.textContent = ''; return; }
    let c = textCache.get(key);
    if (!c) {
      try {
        const p = await Q.getPassage('surah', seg.s);
        p.ayahs.forEach(x => textCache.set(x.s + ':' + x.a, { text: Q.stripBasmala(x.s, x.a, x.text), tr: x.tr }));
        c = textCache.get(key);
      } catch (e) { /* text not available offline */ }
    }
    if (P.currentKey() !== key) return;
    ayEl.hidden = false; trEl.hidden = !S.prefs.get('showTranslation');
    ayEl.innerHTML = c ? esc(c.text) + ` <span class="end">${endMark(seg.a)}</span>` : '';
    trEl.textContent = c ? c.tr : '';
  }
  function renderQueue() {
    const s = P.state();
    const box = $('#npQueue');
    if (!s.queue || s.queue.length < 2) { box.innerHTML = ''; return; }
    const tok = ++queueTok;
    Promise.all(s.queue.map(d => L.describe(d).catch(() => ({ title: '?', subtitle: '' })))).then(infos => {
      if (tok !== queueTok) return;
      box.innerHTML = `<h3 class="sub-title">${t('queue')}</h3><ol class="queue">` + infos.map((inf, i) =>
        `<li><button class="queue-item${i === s.index ? ' is-current' : ''}" data-act="queueJump" data-i="${i}"><span dir="auto">${esc(inf.title)}</span></button></li>`).join('') + '</ol>';
    });
  }
  let queueTok = 0;
  function openSheet() { const sh = $('#sheet'); sh.hidden = false; requestAnimationFrame(() => sh.classList.add('open')); updateSheetAyah(); renderQueue(); }
  function closeSheet() { const sh = $('#sheet'); sh.classList.remove('open'); setTimeout(() => { if (!sh.classList.contains('open')) sh.hidden = true; }, 220); }

  async function rangeMenu() {
    const s = P.state();
    if (!s.verses) return;
    if (s.range) { P.clearRange(); toast(t('rangeCleared')); return; }
    const segs = s.track.segments.map((g, i) => ({ g, i })).filter(x => !x.g.basmala);
    const opts = segs.map(x => `<option value="${x.i}">${esc(num(x.g.s) + ':' + num(x.g.a))}</option>`).join('');
    const res = await openDialog(`<h2 class="dlg-title">${t('repeatRange')}</h2><p class="dlg-msg">${t('rangeHelp')}</p>
      <form class="dlg-form" method="dialog"><div class="two"><label class="field"><span>${t('from')}</span><select class="select" name="a">${opts}</select></label>
      <label class="field"><span>${t('to')}</span><select class="select" name="b">${opts}</select></label></div>
      <div class="dlg-buttons"><button type="button" class="btn ghost" data-cancel>${t('cancel')}</button><button class="btn primary">${t('repeat')}</button></div></form>`,
      (dlg, close) => {
        const f = $('form', dlg);
        const cur = segs.find(x => x.i >= s.seg) || segs[0];
        f.a.value = String(cur.i); f.b.value = String(Math.min(cur.i + 4, segs[segs.length - 1].i));
        $('[data-cancel]', dlg).onclick = () => close(null);
        f.addEventListener('submit', e => { e.preventDefault(); close({ a: +f.a.value, b: +f.b.value }); });
      });
    if (res) { P.setRange(Math.min(res.a, res.b), Math.max(res.a, res.b)); toast(t('rangeSet')); }
  }

  // ---- Delegated actions ------------------------------------------------------------------
  const actions = {
    homeTab: el => renderHomeBody(el.dataset.tab),
    hideFileNote: el => { S.prefs.set('hideFileNote', true); el.closest('.notice').remove(); },
    resume: () => { const l = S.last.get(); if (l) P.loadQueue(l.queue, l.index, { seg: l.seg, time: l.time, autoplay: true }); },
    retry: () => route(),
    reloadMp3q: () => ctx.reloadMp3q && ctx.reloadMp3q(),
    archMore: () => ctx.archMore && ctx.archMore(),
    readMode: el => { S.prefs.set('readMode', el.dataset.mode); $$('[data-act=readMode]').forEach(b => b.setAttribute('aria-selected', String(b === el))); renderAyahs(); },
    playPassage: () => { const d = currentDesc(); if (d) P.loadQueue([d], 0, { autoplay: true }); },
    dlPassage: () => { const d = currentDesc(); if (d) downloadToggle(d); },
    favPassage: async () => { const d = currentDesc(); if (!d) return; const it = await trackItem(d); const on = S.favs.toggle(it); toast(on ? t('favAdded') : t('favRemoved')); updateRecBar(); },
    plPassage: async () => { const d = currentDesc(); if (d) addToPlaylist(await trackItem(d)); },
    ayahMenu: el => ayahMenu(el.dataset.key),
    playAyah: el => playFromAyah(el.dataset.key, false),
    favAyah: el => toggleFavAyah(el.dataset.key, el),
    playRow: el => { const q = listQueue(el); P.loadQueue(q.descs, q.index, { autoplay: true }); },
    rowMenu: el => rowMenu(el),
    playAllList: () => { const rows = $$('.track-row', V()); if (rows.length) P.loadQueue(rows.map(r => JSON.parse(r.dataset.desc)), 0, { autoplay: true }); },
    favItem: el => { const on = S.favs.toggle({ id: 'item:' + el.dataset.id, kind: 'item', identifier: el.dataset.id, title: el.dataset.title }); el.classList.toggle('is-on', on); el.setAttribute('aria-pressed', String(on)); el.innerHTML = icon(on ? 'heartF' : 'heart'); toast(on ? t('favAdded') : t('favRemoved')); },
    unfav: el => { S.favs.remove(el.dataset.id); route(); },
    newPlaylist: async () => { const n = await promptText(t('newPlaylist'), '', t('create')); if (n) { const p = S.playlists.create(n); go('#/playlist/' + p.id); } },
    renamePlaylist: async el => { const p = S.playlists.get(el.dataset.id); const n = await promptText(t('rename'), p.name); if (n) { S.playlists.rename(p.id, n); route(); } },
    deletePlaylist: async el => { if (await confirmBox(t('confirmDeletePlaylist'), t('delete'), true)) { S.playlists.remove(el.dataset.id); go('#/saved/playlists'); } },
    removeAllDownloads: async () => { if (await confirmBox(t('confirmRemoveAll'), t('remove'), true)) { await O.removeAll(); toast(t('downloadRemoved')); route(); } },
    setPref: el => {
      const k = el.dataset.pref, v = el.dataset.val;
      if (k === 'lang') {
        AB.i18n.setLang(v); buildChrome(); updatePlayerUI(); route();
        const tr = P.state().track;
        if (tr) L.describe(tr.desc).then(info => { tr.title = info.title; tr.subtitle = info.subtitle; updatePlayerUI(); }).catch(() => {});
        return;
      }
      S.prefs.set(k, v); applyAppearance();
      $$(`[data-act=setPref][data-pref=${k}]`).forEach(b => b.setAttribute('aria-pressed', String(b === el)));
    },
    togglePref: el => { const k = el.dataset.pref; const v = !S.prefs.get(k); S.prefs.set(k, v); el.setAttribute('aria-checked', String(v)); },
    downloadText: async el => {
      if (!navigator.onLine) { toast(t('errOffline')); return; }
      el.disabled = true; const label = $('span', el);
      try { await Q.downloadFullText(null, p => { label.textContent = t('downloadingPct', { n: num(Math.round(p * 100)) }); }); toast(t('textSaved')); route(); }
      catch (e) { toast(t('errText')); el.disabled = false; label.textContent = t('downloadText'); }
    },
    install: () => AB.pwa && AB.pwa.install(),
    openSheet: () => openSheet(),
    closeSheet: () => closeSheet(),
    togglePlay: () => P.toggle(),
    nextTrack: () => P.next(),
    prevTrack: () => P.prev(),
    seekBack: () => P.seekBy(-10),
    seekFwd: () => P.seekBy(10),
    cycleRepeat: () => { const v = P.cycleRepeat(); toast(t('repeatToast_' + v)); },
    speedMenu: async () => { const v = await choose(t('speed'), [0.5, 0.75, 1, 1.25, 1.5, 1.75, 2].map(x => ({ value: x, label: num(x) + '×' })), P.state().speed); if (v !== undefined) P.setSpeed(+v); },
    sleepMenu: async () => {
      const s = P.state();
      const v = await choose(t('sleepTimer'), [{ value: 0, label: t('off') }, { value: 15, label: t('minutesN', { n: num(15) }) }, { value: 30, label: t('minutesN', { n: num(30) }) }, { value: 45, label: t('minutesN', { n: num(45) }) }, { value: 60, label: t('minutesN', { n: num(60) }) }, { value: 'end', label: t('endOfTrack') }], s.sleepEnd ? 'end' : s.sleepAt ? -1 : 0);
      if (v !== undefined) { P.setSleep(v === 'end' ? 'end' : +v); toast(v === 0 || v === '0' ? t('sleepOff') : t('sleepSet')); }
    },
    ayahRepeatMenu: async () => { const v = await choose(t('repeatEachAyah'), [1, 2, 3, 5, 7, 10, 0].map(x => ({ value: x, label: x === 0 ? t('ayahLoop') : x === 1 ? t('ayahOnce') : t('ayahTimes', { n: num(x) }) })), P.state().ayahRepeat); if (v !== undefined) P.setAyahRepeat(+v); },
    rangeMenu: () => rangeMenu(),
    openText: () => {
      const s = P.state(); if (!s.track) return;
      const d = s.track.desc; closeSheet();
      if (s.segment && !s.segment.basmala) go(`#/surah/${s.segment.s}/${s.segment.a}`);
      else if (d.type === 'surah') go('#/surah/' + d.surah);
      else if (d.type === 'passage') go(`#/${d.kind}/${d.n}`);
      else if (d.type === 'quarter') go('#/hq/' + d.n);
      else if (d.type === 'archive') go('#/item/' + encodeURIComponent(d.identifier));
    },
    queueJump: el => { const s = P.state(); P.loadQueue(s.queue, +el.dataset.i, { autoplay: true }); }
  };
  document.addEventListener('click', e => {
    const el = e.target.closest('[data-act]');
    if (!el || el.disabled) return;
    const fn = actions[el.dataset.act];
    if (!fn) return;
    e.preventDefault();
    fn(el, e);
  });
  document.addEventListener('keydown', e => {
    if ((e.key === 'Enter' || e.key === ' ') && e.target.classList && e.target.classList.contains('ma')) { e.preventDefault(); ayahMenu(e.target.dataset.key); }
    if (e.key === 'Escape' && $('#sheet').classList.contains('open')) closeSheet();
  });

  // ---- Wiring -----------------------------------------------------------------------------
  P.on('state', updatePlayerUI);
  P.on('time', updateTime);
  P.on('track', () => { updatePlayerUI(); renderQueue(); });
  P.on('segment', () => { applyHighlight(true); updatePlayerUI(); updateSheetAyah(); });
  P.on('error', d => toast(d.message));
  P.on('sleep', updatePlayerUI);
  ['progress', 'saved', 'removed', 'cancelled'].forEach(evn => O.on(evn, () => refreshDlStates()));
  O.on('saved', () => toast(t('downloadDone')));
  O.on('error', d => { toast(d.blocked ? t('errDownloadBlocked') : t('errDownload')); refreshDlStates(); });
  window.addEventListener('hashchange', route);
  window.addEventListener('online', () => toast(t('backOnline')));
  window.addEventListener('offline', () => toast(t('nowOffline')));
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyAppearance);
  $('#backBtn').addEventListener('click', () => { if (history.length > 1) history.back(); else go('#/'); });
  document.addEventListener('ab:installable', () => { const r = $('#installRow'); if (r) r.innerHTML = `<span class="set-label">${t('installApp')}</span>${installHelp()}`; });

  AB.i18n.setLang(AB.i18n.getLang());
  applyAppearance();
  buildChrome();
  route();
  updatePlayerUI();
  S.idb.del('text', 'photo').catch(() => {}); // clear any photo saved by the earlier version
})();

</script>
</body>
</html>
