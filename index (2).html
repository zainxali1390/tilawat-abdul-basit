/* ==========================================================================
   Abdul Basit Quran — styles
   Palette: river-green ink with an aged-brass accent (radio-dial brass of the
   1950s–70s recordings). Typography: IBM Plex Sans Arabic for the interface,
   a choice of Qur'anic naskh faces for the text.
   ========================================================================== */
:root {
  --bg: #F2F4F3;
  --surface: #FFFFFF;
  --surface-2: #E7ECEA;
  --ink: #13201C;
  --ink-2: #4E605A;
  --line: #D3DCD9;
  --accent: #7A5A17;
  --accent-ink: #FFFFFF;
  --accent-soft: #F2E9D3;
  --hl: #F5E9C8;
  --danger: #A3322A;
  --ok: #2F6E5F;
  --shadow: 0 10px 30px rgba(19, 32, 28, .14);
  --ui: 'IBM Plex Sans Arabic', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --qfont: 'Amiri Quran', 'Amiri', 'Noto Naskh Arabic', serif;
  --qsize: 30px;
  --tab-h: 62px;
  --mini-h: 62px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
  --r-s: 8px;
  --r-m: 14px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root[data-theme="system"] {
    --bg: #101614; --surface: #161F1C; --surface-2: #1E2A26; --ink: #E4EBE8; --ink-2: #9AAEA8; --line: #27352F;
    --accent: #D4B06A; --accent-ink: #1B1405; --accent-soft: rgba(212, 176, 106, .14); --hl: rgba(212, 176, 106, .15);
    --danger: #E07A70; --ok: #7FC3B2; --shadow: 0 10px 30px rgba(0, 0, 0, .45); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101614; --surface: #161F1C; --surface-2: #1E2A26; --ink: #E4EBE8; --ink-2: #9AAEA8; --line: #27352F;
  --accent: #D4B06A; --accent-ink: #1B1405; --accent-soft: rgba(212, 176, 106, .14); --hl: rgba(212, 176, 106, .15);
  --danger: #E07A70; --ok: #7FC3B2; --shadow: 0 10px 30px rgba(0, 0, 0, .45); color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-padding-top: calc(64px + var(--safe-t)); }
body {
  margin: 0; background: var(--bg); color: var(--ink); font-family: var(--ui); font-size: 16px; line-height: 1.5;
  padding-bottom: calc(var(--tab-h) + var(--safe-b) + 16px); min-height: 100vh;
  -webkit-tap-highlight-color: transparent;
}
body.has-mini { padding-bottom: calc(var(--tab-h) + var(--mini-h) + var(--safe-b) + 16px); }
a { color: inherit; text-decoration: none; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.skip { position: absolute; top: 0; inset-inline-start: 8px; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); background: var(--surface); padding: 8px 12px; z-index: 100; }
.skip:focus { width: auto; height: auto; clip-path: none; }

/* Icons */
.ic { width: 22px; height: 22px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.ic.f { fill: currentColor; stroke: none; }
[dir="rtl"] .ic.flip { transform: scaleX(-1); }
.ic.ok { color: var(--ok); }

/* Top bar */
.topbar {
  position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 4px;
  min-height: 56px; padding: calc(var(--safe-t) + 4px) 8px 4px; background: var(--bg);
  border-bottom: 1px solid var(--line);
}
.topbar-title { font-size: 1.05rem; font-weight: 600; margin: 0 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.view { max-width: 760px; margin: 0 auto; padding: 16px 16px 8px; outline: none; }

/* Buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 16px;
  border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-weight: 500; font-size: .95rem;
}
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--danger); }
.btn.primary.danger, .btn.danger:not(.ghost) { background: var(--danger); border-color: var(--danger); color: #fff; }
.btn.block { width: 100%; margin-top: 8px; }
.btn.round { width: 52px; height: 52px; padding: 0; }
.btn:disabled { opacity: .55; cursor: default; }
.icon-btn {
  display: inline-grid; place-items: center; width: 44px; height: 44px; border: 0; border-radius: 50%;
  background: transparent; color: var(--ink); flex: none;
}
.icon-btn:active { background: var(--surface-2); }
.icon-btn.sm { width: 36px; height: 36px; }
.icon-btn.sm .ic { width: 19px; height: 19px; }
.icon-btn.lg .ic { width: 28px; height: 28px; }
.icon-btn.is-on, .icon-btn.is-saved { color: var(--accent); }
.pct { font-size: .75rem; font-weight: 600; color: var(--accent); font-variant-numeric: tabular-nums; }
.link { color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }

/* Segmented controls */
.seg { display: flex; gap: 4px; padding: 4px; background: var(--surface-2); border-radius: 999px; margin: 4px 0 16px; }
.seg.small { margin: 0; }
.seg-btn {
  flex: 1; min-height: 38px; border: 0; border-radius: 999px; background: transparent; color: var(--ink-2);
  font-size: .92rem; font-weight: 500; display: grid; place-items: center; padding: 0 10px;
}
.seg-btn[aria-selected="true"], .seg-btn[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.reader-body + .pager, .rec-bar + .seg { margin-top: 12px; }

/* Search */
.search {
  display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 14px; margin: 0 0 14px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 999px; color: var(--ink-2);
}
.search input { flex: 1; min-width: 0; border: 0; background: transparent; outline: none; color: var(--ink); font-size: 1rem; }
.search:focus-within { border-color: var(--accent); }

/* Lists */
.list { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-m); overflow: hidden; margin-bottom: 16px; }
.list.compact { margin-bottom: 14px; }
.list > * + * { border-top: 1px solid var(--line); }
.row { display: flex; align-items: center; gap: 12px; min-height: 64px; padding: 10px 12px 10px 14px; background: transparent; }
.row-main { flex: 1; min-width: 0; display: flex; flex-direction: column; text-align: start; background: none; border: 0; padding: 0; }
.row-title { font-weight: 500; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow-wrap: anywhere; }
.row-sub { color: var(--ink-2); font-size: .85rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.surah-row .row-sub, .lib-sec .row-sub { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.row > .ic:last-child { color: var(--ink-2); }
.row-icon { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); flex: none; }
.row-ar { font-family: var(--qfont); font-size: 1.35rem; color: var(--accent); white-space: nowrap; }
.row-ar[lang="en"] { font-family: var(--ui); font-size: .85rem; color: var(--ink-2); }
.badge {
  width: 40px; height: 40px; flex: none; display: grid; place-items: center; font-size: .85rem; font-weight: 600;
  color: var(--accent); border: 1.5px solid var(--accent); border-radius: 50%; font-variant-numeric: tabular-nums;
}
.track-row { gap: 6px; padding-inline-start: 6px; }
.row-play { width: 44px; height: 44px; border: 0; background: none; color: var(--accent); display: grid; place-items: center; border-radius: 50%; flex: none; }
.dl-state { display: grid; place-items: center; min-width: 26px; }
.empty, .empty-inline { text-align: center; color: var(--ink-2); padding: 32px 16px; }
.empty.small { padding: 18px 12px; }
.empty p { margin: 0 0 14px; }
.muted { color: var(--ink-2); }
.small { font-size: .85rem; }
.center { text-align: center; }

/* Resume card */
.resume {
  display: flex; align-items: center; gap: 14px; padding: 16px; margin-bottom: 16px;
  background: var(--surface); border: 1px solid var(--line); border-inline-start: 4px solid var(--accent); border-radius: var(--r-m);
}
.resume-text { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.resume-label { font-size: .8rem; color: var(--accent); font-weight: 600; }
.resume-title { font-size: 1.1rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.resume-sub { color: var(--ink-2); font-size: .88rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* Grids (juz, pages) */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 8px; margin-bottom: 16px; }
.grid.pages { grid-template-columns: repeat(auto-fill, minmax(56px, 1fr)); gap: 6px; }
.tile {
  display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 76px;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-m);
}
.tile.sm { min-height: 44px; border-radius: var(--r-s); font-size: .9rem; font-variant-numeric: tabular-nums; }
.tile-n { font-size: 1.4rem; font-weight: 600; color: var(--accent); }
.tile-l { font-size: .78rem; color: var(--ink-2); }
.juz-label { font-size: .85rem; color: var(--ink-2); font-weight: 600; margin: 18px 0 6px; }
.hizb-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.hizb-label { width: 78px; flex: none; font-weight: 500; font-size: .92rem; }
.quarters { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; flex: 1; }
.q-chip { display: grid; place-items: center; min-height: 40px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-s); font-size: .9rem; }
.page-form { display: flex; gap: 10px; align-items: flex-end; margin-bottom: 16px; }
.field { display: flex; flex-direction: column; gap: 4px; flex: 1; font-size: .88rem; color: var(--ink-2); }
.input, .select {
  min-height: 44px; padding: 0 12px; border-radius: var(--r-s); border: 1px solid var(--line); background: var(--surface); color: var(--ink); width: 100%;
}
.select { appearance: auto; }

/* Reader */
.reader-head { text-align: center; padding: 8px 0 18px; }
.surah-ar {
  font-family: var(--qfont); font-size: clamp(52px, 16vw, 84px); line-height: 1.5; color: var(--accent);
  display: flex; align-items: center; justify-content: center; gap: 18px;
}
.surah-ar::before, .surah-ar::after { content: ''; flex: 0 1 64px; height: 1px; background: var(--accent); opacity: .55; }
.surah-en { font-size: 1.4rem; margin: 0; font-weight: 600; }
.surah-meta { color: var(--ink-2); margin: 4px 0 0; font-size: .92rem; }
.passage-title { font-size: 1.6rem; margin: 6px 0 0; }
.rec-bar { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-m); padding: 12px; margin-bottom: 12px; }
.select-wrap { display: flex; flex-direction: column; gap: 4px; }
.field-label { font-size: .8rem; color: var(--ink-2); }
.rec-actions { display: flex; align-items: center; gap: 4px; margin-top: 10px; }
.rec-actions .btn.primary { margin-inline-end: auto; }
.rec-note { margin: 8px 0 0; font-size: .84rem; color: var(--ink-2); }
.reader-body { margin-top: 18px; }
.basmala { font-family: var(--qfont); font-size: calc(var(--qsize) * 1.05); text-align: center; margin: 8px 0 18px; line-height: 2; }
.ayah { padding: 14px 12px 16px; border-bottom: 1px solid var(--line); border-inline-start: 3px solid transparent; transition: background-color .25s; }
.ayah.is-current { background: var(--hl); border-inline-start-color: var(--accent); }
.ayah.is-target { border-inline-start-color: var(--line); }
.ayah-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.ayah-key {
  border: 1px solid var(--line); background: var(--surface); border-radius: 999px; min-height: 32px; padding: 0 12px;
  font-size: .82rem; color: var(--ink-2); font-variant-numeric: tabular-nums; display: inline-flex; align-items: center;
}
.ayah-tools { display: flex; color: var(--ink-2); }
.ar {
  font-family: var(--qfont); font-size: var(--qsize); line-height: 2.15; margin: 10px 0 6px; text-align: right;
  direction: rtl; word-spacing: .04em; font-feature-settings: "kern", "liga", "calt";
}
.end { color: var(--accent); white-space: nowrap; }
.sajda { color: var(--accent); }
.tr { margin: 6px 0 0; color: var(--ink-2); font-size: 1rem; line-height: 1.65; max-width: 70ch; }
.mushaf {
  font-family: var(--qfont); font-size: var(--qsize); line-height: 2.3; text-align: justify; text-align-last: center;
  padding: 18px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-m); margin-bottom: 14px;
}
.ma { border-radius: 6px; cursor: pointer; transition: background-color .25s; padding: 2px 0; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
.ma.is-current { background: var(--hl); box-shadow: 0 0 0 3px var(--hl); }
.surah-divider {
  display: flex; flex-direction: column; align-items: center; gap: 2px; margin: 26px 0 10px; padding: 10px;
  border-top: 1px solid var(--accent); border-bottom: 1px solid var(--accent);
}
.surah-divider span { font-family: var(--qfont); font-size: 1.9rem; color: var(--accent); line-height: 1.6; }
.surah-divider a { font-size: .85rem; color: var(--ink-2); }
.surah-divider.cont { border: 0; margin: 4px 0; padding: 4px; }
.surah-divider.cont span { font-size: 1.3rem; }
.pager { display: flex; justify-content: space-between; gap: 10px; margin: 24px 0 8px; }
.pager .btn { max-width: 48%; }
.pager .btn span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* Library */
.lib-sec { margin-bottom: 8px; }
.sec-title { font-size: 1.05rem; margin: 22px 0 4px; }
.sub-title { font-size: .92rem; margin: 18px 0 8px; color: var(--ink-2); }
.sec-note { color: var(--ink-2); font-size: .88rem; margin: 0 0 12px; max-width: 65ch; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 4px; }
.chip { min-height: 40px; display: inline-flex; align-items: center; padding: 0 14px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); font-size: .92rem; }
.col-head { padding: 4px 0 12px; }
.h1 { font-size: 1.45rem; margin: 0 0 6px; line-height: 1.35; }
.col-head p { margin: 0 0 6px; }
.desc { color: var(--ink-2); font-size: .92rem; }
.row-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 12px 0 16px; }
.usage { font-weight: 500; margin: 0 0 12px; }
.fav-ayah { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-m); margin-bottom: 10px; }

/* Settings */
.set-sec { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-m); padding: 4px 14px; margin-bottom: 16px; }
.set-sec .sec-title { margin: 14px 0 4px; }
.set-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }
.set-sec .sec-title + .set-row { border-top: 0; }
.set-row.col { flex-direction: column; align-items: stretch; }
.set-row .select { max-width: 60%; }
.set-row.col .select { max-width: none; }
.set-label { font-weight: 500; display: flex; flex-direction: column; }
.set-label small { color: var(--ink-2); font-weight: 400; font-size: .82rem; }
.set-label output { color: var(--accent); }
.set-note { margin: 0; color: var(--ink-2); font-size: .88rem; }
.set-row .seg { min-width: 0; flex: 0 1 auto; }
.preview { margin: 4px 0 14px; text-align: center; }
.sources { margin: 4px 0 8px; padding-inline-start: 18px; color: var(--ink-2); font-size: .9rem; }
input[type="range"] { width: 100%; accent-color: var(--accent); min-height: 32px; }
.switch { width: 52px; height: 32px; border-radius: 999px; border: 0; background: var(--line); position: relative; flex: none; padding: 0; }
.switch span { position: absolute; top: 4px; inset-inline-start: 4px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: inset-inline-start .15s; box-shadow: 0 1px 2px rgba(0,0,0,.3); }
.switch[aria-checked="true"] { background: var(--accent); }
.switch[aria-checked="true"] span { inset-inline-start: 24px; }

/* Bottom tab bar */
.tabbar {
  position: fixed; inset: auto 0 0 0; z-index: 30; display: grid; grid-template-columns: repeat(4, 1fr);
  height: calc(var(--tab-h) + var(--safe-b)); padding-bottom: var(--safe-b); background: var(--surface); border-top: 1px solid var(--line);
}
.tab { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: .74rem; color: var(--ink-2); }
.tab[aria-current="page"] { color: var(--accent); font-weight: 600; }

/* Mini player */
.mini {
  position: fixed; inset-inline: 8px; bottom: calc(var(--tab-h) + var(--safe-b) + 6px); z-index: 31; height: var(--mini-h);
  display: flex; align-items: center; gap: 2px; padding: 0 6px 0 4px; background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--r-m); box-shadow: var(--shadow); overflow: hidden; max-width: 744px; margin: 0 auto;
}
.mini-progress { position: absolute; inset: 0 0 auto 0; height: 2px; background: var(--line); }
.mini-progress span { display: block; height: 100%; width: 0; background: var(--accent); }
.mini-main { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: flex-start; text-align: start; background: none; border: 0; padding: 0 10px; height: 100%; justify-content: center; }
.mini-title { font-weight: 600; font-size: .95rem; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mini-sub { font-size: .8rem; color: var(--ink-2); max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.spinner { width: 22px; height: 22px; border-radius: 50%; border: 2.5px solid currentColor; border-top-color: transparent; animation: spin .8s linear infinite; display: inline-block; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Full player sheet */
.sheet {
  position: fixed; inset: 0; z-index: 50; background: var(--bg); transform: translateY(100%); transition: transform .22s ease-out;
  overflow-y: auto; padding: calc(var(--safe-t) + 6px) 16px calc(var(--safe-b) + 16px);
}
.sheet.open { transform: none; }
.sheet-inner { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; min-height: 100%; }
.sheet-top { display: flex; align-items: center; justify-content: space-between; }
.sheet-label { font-size: .85rem; color: var(--ink-2); font-weight: 500; }
.np-main { flex: 1; display: flex; flex-direction: column; justify-content: center; text-align: center; padding: 16px 0; min-height: 240px; }
.np-title { font-size: 1.5rem; font-weight: 600; }
.np-sub { color: var(--ink-2); margin-bottom: 18px; }
.np-ayah { font-family: var(--qfont); font-size: calc(var(--qsize) * .95); line-height: 2.1; max-height: 42vh; overflow-y: auto; padding: 0 4px; }
.np-tr { color: var(--ink-2); font-size: .95rem; margin-top: 8px; max-height: 18vh; overflow-y: auto; }
.np-seek input { margin: 0; }
.np-times { display: flex; justify-content: space-between; font-size: .82rem; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.np-controls { display: flex; align-items: center; justify-content: space-between; margin: 14px 0; }
.play-big { width: 72px; height: 72px; border-radius: 50%; border: 0; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; }
.play-big .ic { width: 32px; height: 32px; }
.np-options { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-bottom: 14px; }
.opt { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: .85rem; color: var(--ink-2); }
.opt .ic { width: 18px; height: 18px; }
.opt.is-on { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
.sheet:not(.verses) .verse-only { display: none; }
.queue { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-m); overflow: hidden; }
.queue li + li { border-top: 1px solid var(--line); }
.queue-item { width: 100%; text-align: start; border: 0; background: none; min-height: 44px; padding: 8px 14px; }
.queue-item.is-current { color: var(--accent); font-weight: 600; }

/* Dialogs */
.dlg {
  border: 0; padding: 0; border-radius: 18px 18px 0 0; width: 100%; max-width: 560px; margin: auto auto 0;
  background: var(--surface); color: var(--ink); box-shadow: var(--shadow); max-height: 86vh;
}
.dlg::backdrop { background: rgba(0, 0, 0, .45); }
@media (min-width: 640px) { .dlg { border-radius: 18px; margin: auto; } }
.dlg-body { padding: 18px 16px calc(16px + var(--safe-b)); }
.dlg-title { font-size: 1.05rem; margin: 0 0 12px; }
.dlg-msg { margin: 0 0 16px; }
.dlg-buttons { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
.dlg-form .two { display: flex; gap: 10px; }
.sheet-actions, .choices { display: flex; flex-direction: column; }
.sheet-act, .choice {
  display: flex; align-items: center; gap: 14px; min-height: 52px; padding: 0 8px; border: 0; background: none;
  text-align: start; border-radius: var(--r-s); font-size: 1rem;
}
.choice { justify-content: space-between; }
.choice[aria-pressed="true"] { color: var(--accent); font-weight: 600; }
.sheet-act:active, .choice:active { background: var(--surface-2); }
.sheet-act.danger { color: var(--danger); }
.sheet-act:disabled { opacity: .4; }

/* Toast */
.toast {
  position: fixed; left: 50%; bottom: calc(var(--tab-h) + var(--mini-h) + var(--safe-b) + 18px); z-index: 60;
  transform: translate(-50%, 20px); opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s;
  background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-size: .9rem; max-width: calc(100% - 32px); text-align: center;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* Arabic interface */
[dir="rtl"] body { font-size: 16.5px; }
[dir="rtl"] .row-sub, [dir="rtl"] .sec-note { line-height: 1.7; }

/* Wider screens (tablets) */
@media (min-width: 900px) {
  .view { padding-top: 24px; }
  .tabbar { left: 50%; right: auto; transform: translateX(-50%); width: 760px; border: 1px solid var(--line); border-bottom: 0; border-radius: 16px 16px 0 0; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation-duration: .01ms !important; }
}

.notice { background: var(--accent-soft); border: 1px solid var(--accent); border-radius: var(--r-m); padding: 12px 14px; margin-bottom: 16px; font-size: .92rem; }
.notice p { margin: 0 0 8px; }
.notice .btn { min-height: 36px; }

.lost-row { opacity: .55; }
.lost-row .row-play { color: var(--ink-2); }

/* Section covers */
.cover { width: 44px; height: 44px; flex: none; display: block; border-radius: 12px; }
.cover.lg { width: 76px; height: 76px; border-radius: 18px; margin-bottom: 12px; }
.preset-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 8px; margin-bottom: 8px; }
.preset-tile { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 12px 6px; text-align: center; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-m); font-size: .88rem; font-weight: 500; }
.preset-tile .cover { width: 52px; height: 52px; }

</style>

/* ---- js/storage.js ---- */
/* Storage: IndexedDB (audio blobs, download records, cached text) and localStorage
   (preferences, favourites, playlists, last listening position). */
(function () {
  'use strict';
  const AB = window.AB = window.AB || {};

  const DB_NAME = 'abdulbasit-quran';
  const DB_VERSION = 1;
  const STORES = ['audio', 'downloads', 'text'];
  let dbPromise = null;

  function openDB() {
    if (dbPromise) return dbPromise;
    dbPromise = new Promise((resolve, reject) => {
      if (!('indexedDB' in window)) { reject(new Error('IndexedDB is not available')); return; }
      const req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onupgradeneeded = () => {
        const db = req.result;
        STORES.forEach(name => { if (!db.objectStoreNames.contains(name)) db.createObjectStore(name, { keyPath: 'key' }); });
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
    dbPromise.catch(() => { dbPromise = null; });
    return dbPromise;
  }

  function run(store, mode, fn) {
    return openDB().then(db => new Promise((resolve, reject) => {
      const tx = db.transaction(store, mode);
      const req = fn(tx.objectStore(store));
      let result;
      if (req) req.onsuccess = () => { result = req.result; };
      tx.oncomplete = () => resolve(result);
      tx.onerror = () => reject(tx.error);
      tx.onabort = () => reject(tx.error || new Error('Transaction aborted'));
    }));
  }

  const idb = {
    get: (store, key) => run(store, 'readonly', s => s.get(key)),
    put: (store, value) => run(store, 'readwrite', s => s.put(value)),
    del: (store, key) => run(store, 'readwrite', s => s.delete(key)),
    all: store => run(store, 'readonly', s => s.getAll()),
    keys: store => run(store, 'readonly', s => s.getAllKeys()),
    clear: store => run(store, 'readwrite', s => s.clear())
  };

  function lsGet(key, fallback) {
    try { const v = localStorage.getItem(key); return v == null ? fallback : JSON.parse(v); } catch (e) { return fallback; }
  }
  function lsSet(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { /* storage full or blocked */ } }

  const PREF_DEFAULTS = {
    theme: 'system',            // system | light | dark
    quranFont: 'Amiri Quran',
    fontSize: 30,
    showTranslation: true,
    translation: 'en.sahih',
    readMode: 'translation',    // translation | mushaf
    follow: true,               // auto-scroll to the ayah being recited
    speed: 1,
    repeat: 'off',              // off | all | one
    ayahRepeat: 1,              // times each ayah plays in verse-by-verse mode (0 = endless)
    collection: 'vb-murattal',  // last chosen recitation for the reader
    homeTab: 'surahs'
  };
  const prefs = {
    get(k) { const p = lsGet('ab.prefs', {}); return Object.prototype.hasOwnProperty.call(p, k) ? p[k] : PREF_DEFAULTS[k]; },
    set(k, v) { const p = lsGet('ab.prefs', {}); p[k] = v; lsSet('ab.prefs', p); }
  };

  // Favourites: { id, kind: 'track'|'ayah'|'item', title, subtitle, desc?, key?, identifier?, addedAt }
  const favs = {
    list() { return lsGet('ab.favs', []); },
    has(id) { return favs.list().some(f => f.id === id); },
    toggle(item) {
      const l = favs.list();
      const i = l.findIndex(f => f.id === item.id);
      if (i >= 0) { l.splice(i, 1); lsSet('ab.favs', l); return false; }
      l.unshift(Object.assign({ addedAt: Date.now() }, item));
      lsSet('ab.favs', l);
      return true;
    },
    remove(id) { lsSet('ab.favs', favs.list().filter(f => f.id !== id)); }
  };

  // Playlists: { id, name, items: [{ id, desc, title, subtitle }] }
  const playlists = {
    list() { return lsGet('ab.playlists', []); },
    save(l) { lsSet('ab.playlists', l); },
    get(id) { return playlists.list().find(p => p.id === id) || null; },
    create(name) {
      const l = playlists.list();
      const p = { id: 'pl' + Date.now().toString(36), name: name, items: [], createdAt: Date.now() };
      l.push(p); playlists.save(l); return p;
    },
    update(id, fn) {
      const l = playlists.list(); const p = l.find(x => x.id === id);
      if (!p) return null; fn(p); playlists.save(l); return p;
    },
    add(id, item) {
      let added = false;
      playlists.update(id, p => { if (!p.items.some(x => x.id === item.id)) { p.items.push(item); added = true; } });
      return added;
    },
    removeItem(id, index) { playlists.update(id, p => p.items.splice(index, 1)); },
    move(id, from, to) {
      playlists.update(id, p => {
        if (to < 0 || to >= p.items.length) return;
        const [it] = p.items.splice(from, 1); p.items.splice(to, 0, it);
      });
    },
    rename(id, name) { playlists.update(id, p => { p.name = name; }); },
    remove(id) { playlists.save(playlists.list().filter(p => p.id !== id)); }
  };

  const last = {
    get() { return lsGet('ab.last', null); },
    set(v) { lsSet('ab.last', v); },
    clear() { try { localStorage.removeItem('ab.last'); } catch (e) { /* ignore */ } }
  };

  AB.store = { idb, prefs, favs, playlists, last, lsGet, lsSet };
})();

    await st.put('text', { key: 'full:' + tr, ayahs: flatTr, at: Date.now() });
    delete fullMemo[tr];
    onProgress && onProgress(1);
  }

  function deriveFromFull(kind, n, full) {
    const out = [];
    const push = g => {
      const p = fromGlobal(g), a = full.ar[g - 1];
      out.push({ s: p.s, a: p.a, g, text: a[0], page: a[1], juz: a[2], hq: a[3], sajda: !!a[4], tr: full.tr[g - 1] });
    };
    if (kind === 'surah') {
      const s = surah(n); for (let g = START[n]; g < START[n] + s.ayahs; g++) push(g);
    } else {
      const idx = kind === 'page' ? 1 : kind === 'juz' ? 2 : 3;
      for (let g = 1; g <= TOTAL_AYAHS; g++) if (full.ar[g - 1][idx] === n) push(g);
    }
    return { key: kind + ':' + n, ayahs: out, offline: true };
  }

  async function getPassage(kind, n, tr) {
    tr = tr || AB.store.prefs.get('translation');
    n = +n;
    if (!LIMITS[kind] || n < 1 || n > LIMITS[kind]) throw new Error('Out of range');
    let full = null;
    try { full = await loadFull(tr); } catch (e) { /* IndexedDB may be unavailable */ }
    if (full) return deriveFromFull(kind, n, full);
    const key = kind + ':' + n + ':' + tr;
    let cached = null;
    try { cached = await AB.store.idb.get('text', key); } catch (e) { /* ignore */ }
    if (cached && cached.ayahs && cached.ayahs.length) return cached;
    const ep = kind === 'hq' ? 'hizbQuarter' : kind;
    const [ar, en] = await Promise.all([
      fetchJSON(`${API}/${ep}/${n}/quran-uthmani`),
      fetchJSON(`${API}/${ep}/${n}/${tr}`)
    ]);
    const ayahs = ar.ayahs.map((x, i) => ({
      s: x.surah ? x.surah.number : n, a: x.numberInSurah, g: x.number, text: x.text,
      tr: en.ayahs[i] ? en.ayahs[i].text : '', page: x.page, juz: x.juz, hq: x.hizbQuarter, sajda: !!x.sajda
    }));
    const data = { key, ayahs, at: Date.now() };
    AB.store.idb.put('text', data).catch(() => {});
    return data;
  }

  // Remove the leading basmala that the Uthmani text includes in ayah 1 (except Al-Fatihah).
  function stripBasmala(s, a, text) {
    if (a !== 1 || s === 1 || s === 9) return text;
    const words = text.split(' ');
    if (words.length > 4 && normalizeArabic(words[0]).startsWith('بسم')) return words.slice(4).join(' ');
    return text;
  }

  AB.quran = {
    SURAHS, TOTAL_AYAHS, TRANSLATIONS, LIMITS, API,
    surah, globalIndex, fromGlobal, searchSurahs, getPassage, stripBasmala,
    downloadFullText, hasFullText, toArabicDigits, normalizeArabic, normalizeLatin,
    BASMALA: 'بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ'
  };
})();

  <script>
/* ---- js/recitations.js ---- */
/* Recitation library: turns collection configuration + live catalogues into playable tracks.
   A "desc" is a small serialisable description of something playable:
     { type: 'surah',   collectionId, surah, from?, to? }
     { type: 'passage', collectionId, kind: 'juz'|'hq'|'page', n }
     { type: 'archive', identifier, file, title, itemTitle }
   resolve(desc) turns it into a Track:
     { desc, id, title, subtitle, mode: 'file', urls: [...] }
     { desc, id, title, subtitle, mode: 'verses', segments: [{ key, s, a, basmala?, urls }] } */
(function () {
  'use strict';
  const AB = window.AB = window.AB || {};
  const CFG = AB.CONFIG;
  const pad3 = n => String(n).padStart(3, '0');
  const lang = () => AB.i18n.getLang();
  const pick = o => (o && (o[lang()] || o.en)) || '';

  // ---- Source health: skip servers that failed this session -----------------
  const bad = new Set();
  const hostOf = u => { try { const x = new URL(u); return x.origin + x.pathname.replace(/[^/]+$/, ''); } catch (e) { return u; } };
  function markBad(url) { if (url && !url.startsWith('blob:')) bad.add(hostOf(url)); }
  function orderByHealth(urls) { return urls.filter(u => !bad.has(hostOf(u))).concat(urls.filter(u => bad.has(hostOf(u)))); }
  window.addEventListener('online', () => bad.clear());

  // ---- Verse-by-verse collections --------------------------------------------
  const verseCollections = CFG.verseCollections.map(c => Object.assign({ kind: 'verses' }, c));
  function segmentUrls(col, s, a) {
    return col.sources.map(src => src.type === 'global'
      ? src.base + AB.quran.globalIndex(s, a) + '.mp3'
      : src.base + pad3(s) + pad3(a) + '.mp3');
  }

  // ---- mp3quran.net complete recordings ---------------------------------------
  let mp3q = null, mp3qPromise = null;
  const MP3Q_CACHE = 'ab.mp3q.v1';
  const WEEK = 7 * 24 * 3600 * 1000;

  function styleOf(name) {
    const n = name || '';
    if (/مجود/.test(n) || /mojawwad|mujawwad/i.test(n)) return 'mujawwad';
    if (/ورش/.test(n) || /warsh/i.test(n)) return 'warsh';
    if (/معلم/.test(n) || /mo'?lim|muallim/i.test(n)) return 'muallim';
    return 'murattal';
  }
  function buildMp3q(arList, enList) {
    const must = CFG.mp3quran.nameMustInclude;
    const enById = {};
    (enList || []).forEach(r => (r.moshaf || []).forEach(m => { enById[m.id] = { moshaf: m.name, reciter: r.name }; }));
    const out = [];
    (arList || []).forEach(r => {
      const nm = String(r.name || '').replace(/\s+/g, '');
      if (!must.every(m => nm.includes(m))) return;
      (r.moshaf || []).forEach(m => {
        const surahs = String(m.surah_list || '').split(',').map(Number).filter(Boolean);
        if (!surahs.length || !m.server) return;
        out.push({
          id: 'mp3q-' + m.id, kind: 'surahs', style: styleOf(m.name),
          name: { ar: m.name, en: (enById[m.id] && enById[m.id].moshaf) || m.name },
          server: m.server.endsWith('/') ? m.server : m.server + '/',
          surahs, complete: surahs.length === 114, credit: CFG.mp3quran.credit
        });
      });
    });
    const order = { murattal: 0, mujawwad: 1, warsh: 2, muallim: 3 };
    out.sort((a, b) => (order[a.style] - order[b.style]) || (b.surahs.length - a.surahs.length));
    return out;
  }

    const r = await fetch(url, { cache: 'no-cache' });

  function loadMp3Quran(force) {
    if (mp3q && !force) return Promise.resolve(mp3q);
    if (mp3qPromise && !force) return mp3qPromise;
    const cached = AB.store.lsGet(MP3Q_CACHE, null);
    if (cached && !force && Date.now() - cached.at < WEEK) { mp3q = cached.list; return Promise.resolve(mp3q); }
    mp3qPromise = Promise.all([
      fetchJSON(CFG.mp3quran.api + '?language=ar'),
      fetchJSON(CFG.mp3quran.api + '?language=eng').catch(() => null)
    ]).then(([ar, en]) => {
      mp3q = buildMp3q(ar.reciters, en && en.reciters);

      return mp3q;
    }).catch(err => {
      if (cached) { mp3q = cached.list; return mp3q; }
      throw err;

    if (qCache[id]) return qCache[id];

    return out;
  }

    return verseCollections.find(c => c.id === id) || quarterCollections.find(c => c.id === id) || (mp3q || []).find(c => c.id === id) || null;
  }
  async function getCollection(id) {
    const v = getCollectionSync(id);
    if (v) return v;
    if (String(id).startsWith('mp3q-')) { await loadMp3Quran(); return getCollectionSync(id); }
    return null;
  }
  function collectionName(c) { return c ? pick(c.name) : ''; }
  function verseFor(style) { return verseCollections.find(c => c.style === style) || verseCollections[0]; }

  // ---- Internet Archive -------------------------------------------------------
  const arch = CFG.archive;
  const quote = s => '"' + String(s).replace(/"/g, '') + '"';
  function reciterClause() {
    return '(' + arch.reciterTerms.map(t => `title:(${quote(t)}) OR creator:(${quote(t)}) OR subject:(${quote(t)})`).join(' OR ') + ')';
  }
  function termsClause(terms) {
    return '(' + terms.map(t => `title:(${quote(t)}) OR subject:(${quote(t)}) OR description:(${quote(t)})`).join(' OR ') + ')';
  }
  function jsonp(url) {
    return new Promise((resolve, reject) => {
      const cb = '__abjsonp' + Math.random().toString(36).slice(2);
      const s = document.createElement('script');
      const timer = setTimeout(() => { cleanup(); reject(new Error('Timed out')); }, 20000);
      function cleanup() { clearTimeout(timer); delete window[cb]; s.remove(); }
      window[cb] = data => { cleanup(); resolve(data); };
      s.onerror = () => { cleanup(); reject(new Error('Network error')); };
      s.src = url + (url.includes('?') ? '&' : '?') + 'callback=' + cb;

  async function getJSONWithFallback(url) {
    try { const r = await fetch(url); if (!r.ok) throw new Error('HTTP ' + r.status); return await r.json(); }
    catch (e) { if (!navigator.onLine) throw e; return jsonp(url); }

  async function archiveSearch({ preset, q, page }) {
    let query = reciterClause() + ' AND mediatype:(audio)';
    const p = arch.presets.find(x => x.id === preset);
    if (p) query += ' AND ' + termsClause(p.terms);
    if (q && q.trim()) query += ' AND (' + q.trim().replace(/[()]/g, ' ') + ')';

    params.append('sort[]', 'downloads desc');
    params.set('rows', '40'); params.set('page', String(page || 1)); params.set('output', 'json');

      total: res.numFound || 0,
      items: (res.docs || []).map(d => ({
        identifier: d.identifier, title: Array.isArray(d.title) ? d.title[0] : (d.title || d.identifier),
        date: d.date ? String(d.date).slice(0, 10) : '', downloads: d.downloads || 0, size: d.item_size || 0
      }))
    };
  }

  const AUDIO_EXT = /\.(mp3|m4a|ogg|opus|wav|aac|flac)$/i;
  function parseLength(v) {
    if (v == null) return 0;
    const s = String(v);
    if (s.includes(':')) return s.split(':').reduce((acc, x) => acc * 60 + parseFloat(x || 0), 0);
    return parseFloat(s) || 0;
  }
  const itemCache = {};
  async function archiveItem(identifier) {
    if (itemCache[identifier]) return itemCache[identifier];
    const data = await getJSONWithFallback(arch.metadata + encodeURIComponent(identifier));
    if (!data || !data.files) throw new Error('Item not found');
    const md = data.metadata || {};
    // Group files by name without extension and keep the best playable version.
    const rank = f => {
      const fmt = String(f.format || '');
      if (/\.mp3$/i.test(f.name) && f.source === 'original') return 0;
      if (fmt === 'VBR MP3') return 1;

      if (/\.mp3$/i.test(f.name)) return 3;
      if (/64Kbps MP3/i.test(fmt)) return 4;
      if (/\.(m4a|aac)$/i.test(f.name)) return 5;
      if (/\.(ogg|opus)$/i.test(f.name)) return 6;

      if (!groups[base] || rank(f) < rank(groups[base])) groups[base] = f;
    });
    const coll = new Intl.Collator(undefined, { numeric: true, sensitivity: 'base' });
    const files = Object.values(groups).sort((a, b) => coll.compare(a.name, b.name)).map(f => ({
      name: f.name,

/* ---- js/offline.js ---- */
/* Offline downloads. Kept separate from streaming: the player streams from the network

  class BlockedError extends Error {}

  async function fetchBlob(urls, signal) {
    let lastErr;

        const r = await fetch(url, { mode: 'cors', signal });
        if (!r.ok) throw new Error('HTTP ' + r.status);
        const blob = await r.blob();

        return { url, blob };

        if (e.name === 'AbortError') throw e;

    throw lastErr || new Error('Download failed');

    const idb = AB.store.idb;

  async function findSaved(urls) {

    save, cancel, progress, remove, removeAll, list, usage, isSaved, findSaved,
    on: (type, fn) => ev.addEventListener(type, e => fn(e.detail))
  };
})();

/* ---- js/pwa.js ---- */
/* PWA: registers the service worker (only works over http://localhost or https://)
   and handles the "Install app" prompt. */
(function () {
  'use strict';
  const AB = window.AB = window.AB || {};
  AB.VERSION = '1.2.0';
  let deferred = null;

  window.addEventListener('beforeinstallprompt', e => {
    e.preventDefault();
    deferred = e;
    document.dispatchEvent(new Event('ab:installable'));
  });
  window.addEventListener('appinstalled', () => {
    deferred = null;
    document.dispatchEvent(new Event('ab:installable'));
  });

  async function install() {
    if (!deferred) return false;
    deferred.prompt();
    const choice = await deferred.userChoice.catch(() => null);
    deferred = null;
    document.dispatchEvent(new Event('ab:installable'));
    return !!(choice && choice.outcome === 'accepted');
  }

  const secure = location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1';
  if ('serviceWorker' in navigator && secure) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').then(reg => {
        reg.addEventListener('updatefound', () => {
          const w = reg.installing;
          if (!w) return;
          w.addEventListener('statechange', () => {
            if (w.state === 'installed' && navigator.serviceWorker.controller) {
              const el = document.getElementById('toast');
              if (el) { el.textContent = AB.i18n.t('updateReady'); el.classList.add('show'); setTimeout(() => el.classList.remove('show'), 5000); }
            }
          });
        });
      }).catch(() => { /* app still works without offline shell */ });
    });
  }

  AB.pwa = { install, canInstall: () => !!deferred, swSupported: secure && 'serviceWorker' in navigator };
})();

    [/^\/?$/, viewHome],
    [/^\/surah\/(\d+)(?:\/(\d+))?$/, viewSurah],
    [/^\/(juz|hq|page)\/(\d+)$/, viewPassage],
    [/^\/library$/, viewLibrary],
    [/^\/collection\/([\w-]+)$/, viewCollection],
    [/^\/archive$/, viewArchive],
    [/^\/item\/(.+)$/, viewItem],
    [/^\/saved(?:\/(\w+))?$/, viewSaved],
    [/^\/playlist\/([\w-]+)$/, viewPlaylist],
    [/^\/settings$/, viewSettings]
  ];
  function route() {
    const raw = location.hash.replace(/^#/, '') || '/';
    const [path, qs] = raw.split('?');
    const params = new URLSearchParams(qs || '');
    for (const [re, fn] of routes) {
      const m = path.match(re);
      if (m) {
        renderTok++;
        ctx = { view: fn.name.replace('view', '').toLowerCase() };
        setActiveTab(path);
        window.scrollTo(0, 0);
        fn(m, params);
        return;
      }
    }
    location.replace('#/');
  }
  function setActiveTab(path) {
    const tab = path.startsWith('/library') || path.startsWith('/collection') || path.startsWith('/archive') || path.startsWith('/item') ? 'library'
      : path.startsWith('/saved') || path.startsWith('/playlist') ? 'saved'
      : path.startsWith('/settings') ? 'settings' : 'quran';
    $$('.tab').forEach(a => a.setAttribute('aria-current', a.dataset.tab === tab ? 'page' : 'false'));
  }
  function setTop(title, back) {
    $('#topTitle').textContent = title;
    $('#backBtn').hidden = !back;
    document.title = title === t('appName') ? t('appName') : title + ' · ' + t('appName');
  }

  // ---- Home: surahs, juz, quarters, pages ----------------------------------------------
  const HOME_TABS = ['surahs', 'juz', 'hq', 'pages'];
  function viewHome(m, params) {
    setTop(t('appName'), false);
    const tab = HOME_TABS.includes(params.get('tab')) ? params.get('tab') : S.prefs.get('homeTab');
    const fileNote = location.protocol === 'file:' && !S.prefs.get('hideFileNote')
      ? `<section class="notice"><p>${t('installFile')}</p><button class="btn ghost" data-act="hideFileNote">${t('gotIt')}</button></section>` : '';
    V().innerHTML = `${fileNote}${resumeHTML()}
      <div class="seg" role="tablist">${HOME_TABS.map(k => `<button role="tab" class="seg-btn" data-act="homeTab" data-tab="${k}" aria-selected="${k === tab}">${t('home_' + k)}</button>`).join('')}</div>
      <div id="homeBody"></div>`;
    renderHomeBody(tab);
  }
  function resumeHTML() {
    const l = S.last.get();
    if (!l || !l.queue || !l.queue.length) return '';
    const pos = l.ayah ? t('atAyah', { k: l.ayah.split(':').map(num).join(':') }) : (l.time > 1 ? t('atTime', { t: fmtTime(l.time) }) : '');
    return `<section class="resume" aria-label="${t('continueListening')}">
      <div class="resume-text"><span class="resume-label">${t('continueListening')}</span>
      <span class="resume-title" dir="auto">${esc(l.title)}</span>
      <span class="resume-sub" dir="auto">${esc(l.subtitle)}${pos ? ' · ' + esc(pos) : ''}</span></div>
      <button class="btn primary round" data-act="resume" aria-label="${t('resume')}">${icon('play')}</button></section>`;
  }
  function surahRow(s) {
    const ar = lang() === 'ar';
    const sub = (ar ? '' : s.meaning + ' · ') + t('ayahsN', { n: num(s.ayahs) }) + ' · ' + t(s.type);
    return `<a class="row surah-row" href="#/surah/${s.n}" data-n="${s.n}">
      <span class="badge">${num(s.n)}</span>
      <span class="row-main"><span class="row-title">${esc(ar ? s.ar : s.en)}</span><span class="row-sub">${esc(sub)}</span></span>
      <span class="row-ar" lang="${ar ? 'en' : 'ar'}" dir="${ar ? 'ltr' : 'rtl'}">${esc(ar ? s.en : s.ar)}</span></a>`;
  }
  function renderHomeBody(tab) {
    S.prefs.set('homeTab', tab);
    $$('.seg-btn[data-act=homeTab]').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === tab)));
    const body = $('#homeBody');
    if (tab === 'surahs') {
      body.innerHTML = `<label class="search">${icon('search')}<input id="surahSearch" type="search" autocomplete="off" placeholder="${t('searchSurahs')}" aria-label="${t('searchSurahs')}"></label>
        <div id="recMatches"></div><div class="list" id="surahList">${Q.SURAHS.map(surahRow).join('')}</div>
        <p class="empty-inline" id="noSurah" hidden>${t('noSurahMatch')}</p>`;
      const inp = $('#surahSearch');
      inp.addEventListener('input', () => filterSurahs(inp.value));
    } else if (tab === 'juz') {
      body.innerHTML = `<div class="grid">${Array.from({ length: 30 }, (_, i) => `<a class="tile" href="#/juz/${i + 1}"><span class="tile-n">${num(i + 1)}</span><span class="tile-l">${t('juz')}</span></a>`).join('')}</div>`;
    } else if (tab === 'hq') {
      let html = `<p class="sec-note">${t('quartersNote')}</p>` + (L.quarterCollections.length
        ? `<h3 class="sub-title">${t('arbaaKhatmas')}</h3><div class="list compact">${L.quarterCollections.map(collectionRow).join('')}</div>` : '');
      for (let j = 1; j <= 30; j++) {
        html += `<h3 class="juz-label">${t('juzN', { n: num(j) })}</h3>`;
        for (let h = j * 2 - 1; h <= j * 2; h++) {
          html += `<div class="hizb-row"><span class="hizb-label">${t('hizbN', { n: num(h) })}</span><div class="quarters">` +
            [1, 2, 3, 4].map(q => `<a class="q-chip" href="#/hq/${(h - 1) * 4 + q}" aria-label="${esc(L.passageTitle('hq', (h - 1) * 4 + q))}">${t('q' + q)}</a>`).join('') + `</div></div>`;
        }
      }
      body.innerHTML = html;
    } else {
      body.innerHTML = `<form class="page-form" id="pageForm"><label class="field"><span>${t('goToPage')}</span>
        <input class="input" type="number" name="p" min="1" max="604" inputmode="numeric" required placeholder="1–604"></label>
        <button class="btn primary">${t('open')}</button></form>
        <div class="grid pages">${Array.from({ length: 604 }, (_, i) => `<a class="tile sm" href="#/page/${i + 1}">${num(i + 1)}</a>`).join('')}</div>`;
      $('#pageForm').addEventListener('submit', e => {
        e.preventDefault();
        const p = +e.target.p.value; if (p >= 1 && p <= 604) go('#/page/' + p);
      });
    }
  }
  function filterSurahs(q) {
    const hits = new Set(Q.searchSurahs(q).map(s => s.n));
    $$('#surahList .surah-row').forEach(r => { r.hidden = !hits.has(+r.dataset.n); });
    $('#noSurah').hidden = hits.size > 0;
    const box = $('#recMatches');
    const qq = q.trim();
    if (!qq) { box.innerHTML = ''; return; }
    const norm = s => Q.normalizeLatin(s) + '|' + Q.normalizeArabic(s);
    const qn = Q.normalizeLatin(qq), qa = Q.normalizeArabic(qq);
    const match = txt => { const n = norm(txt); return (qn && n.includes(qn)) || (qa && n.includes(qa)); };
    const cols = L.verseCollections.concat(L.mp3qSync() || []).filter(c => match(c.name.en + ' ' + c.name.ar + ' ' + c.style));
    const presets = L.archive.presets.filter(p => match(p.name.en + ' ' + p.name.ar + ' ' + p.terms.join(' ')));
    box.innerHTML = (cols.length || presets.length || qq.length > 2) ? `<div class="list compact">` +
      cols.map(collectionRow).join('') +
      presets.map(p => `<a class="row" href="#/archive?preset=${p.id}">${cover(p.id)}<span class="row-main"><span class="row-title">${esc(L.pick(p.name))}</span><span class="row-sub">${t('internetArchive')}</span></span>${icon('chev')}</a>`).join('') +
      `<a class="row" href="#/archive?q=${encodeURIComponent(qq)}"><span class="row-icon">${icon('search')}</span><span class="row-main"><span class="row-title">${esc(t('searchArchiveFor', { q: qq }))}</span><span class="row-sub">${t('internetArchive')}</span></span>${icon('chev')}</a></div>` : '';
  }

  // ---- Reader (surah and passages) ----------------------------------------------------
  function verseOptions(sel) {
    return L.verseCollections.map(c => `<option value="${c.id}"${c.id === sel ? ' selected' : ''}>${esc(L.pick(c.name))}</option>`).join('');
  }
  function recOptions(n, sel) {
    let html = `<optgroup label="${esc(t('verseByVerse'))}">${verseOptions(sel)}</optgroup>`;
    const m = (L.mp3qSync() || []).filter(c => c.surahs.includes(n));
    if (m.length) html += `<optgroup label="${esc(t('completeRecordings'))}">` + m.map(c => `<option value="${c.id}"${c.id === sel ? ' selected' : ''}>${esc(L.pick(c.name))}</option>`).join('') + '</optgroup>';
    return html;
  }
  function quarterOptions(sel) {
    if (!L.quarterCollections.length) return '';
    return `<optgroup label="${esc(t('arbaaRecordings'))}">` + L.quarterCollections.map(c => `<option value="${c.id}"${c.id === sel ? ' selected' : ''}>${esc(L.pick(c.name))}</option>`).join('') + '</optgroup>';
  }
  function readerControls() {
    const mode = S.prefs.get('readMode');
    return `<div class="rec-bar">
      <label class="select-wrap"><span class="field-label">${t('recitation')}</span><select id="recSelect" class="select"></select></label>
      <div class="rec-actions">
        <button class="btn primary" data-act="playPassage">${icon('play')}<span>${t('play')}</span></button>
        <button class="icon-btn" id="dlBtn" data-act="dlPassage" aria-label="${t('download')}">${icon('download')}</button>
        <button class="icon-btn" id="favBtn" data-act="favPassage" aria-label="${t('addFavourite')}">${icon('heart')}</button>
        <button class="icon-btn" data-act="plPassage" aria-label="${t('addToPlaylist')}">${icon('listPlus')}</button>
      </div>
      <p class="rec-note" id="recNote"></p>
    </div>
    <div class="seg small" role="tablist" aria-label="${t('readingView')}">
      <button role="tab" class="seg-btn" data-act="readMode" data-mode="translation" aria-selected="${mode === 'translation'}">${t('viewTranslation')}</button>
      <button role="tab" class="seg-btn" data-act="readMode" data-mode="mushaf" aria-selected="${mode === 'mushaf'}">${t('viewMushaf')}</button>
    </div>`;
  }
  function currentDesc() {
    const sel = $('#recSelect');
    if (!sel || !ctx.kind) return null;
    if (ctx.kind === 'surah') return { type: 'surah', collectionId: sel.value, surah: ctx.n };
    const c = L.getCollectionSync(sel.value);
    if (c && c.kind === 'quarters') return { type: 'quarter', collectionId: c.id, n: ctx.n };
    return { type: 'passage', collectionId: sel.value, kind: ctx.kind, n: ctx.n };
  }
  function updateRecBar() {
    const sel = $('#recSelect'); if (!sel) return;
    const c = L.getCollectionSync(sel.value);
    const playBtn = $('[data-act=playPassage]');
    if (playBtn) playBtn.disabled = false;
    $('#recNote').textContent = c && c.kind === 'verses' ? t('highlightOn') : t('highlightOff');
    if (c && c.kind === 'quarters') {
      $('#recNote').textContent = t('loading');
      const want = sel.value, n = ctx.n;
      L.loadQuarters(c.id).then(q => {
        if (sel.value !== want || ctx.n !== n) return;
        const f = q.map[n];
        $('#recNote').textContent = f ? t('quarterRecNote', { label: f.label || '' }) : t('quarterMissingNote');
        if (playBtn) playBtn.disabled = !f;
        $('#dlBtn').disabled = !f;
      }).catch(() => { if (sel.value === want) $('#recNote').textContent = navigator.onLine ? t('errArchive') : t('errOffline'); });
    } else if ($('#dlBtn')) $('#dlBtn').disabled = false;
    const d = currentDesc(); if (!d) return;
    const id = L.descId(d);
    const fb = $('#favBtn');
    const fav = S.favs.has(id);
    fb.innerHTML = icon(fav ? 'heartF' : 'heart'); fb.classList.toggle('is-on', fav);
    fb.setAttribute('aria-pressed', String(fav));
    $('#dlBtn').dataset.id = id;
    refreshDlStates();
  }
  function setupRecSelect(kind, n) {
    const sel = $('#recSelect');
    const want = S.prefs.get('collection');
    const fill = () => {
      const prev = sel.value || want;
      sel.innerHTML = kind === 'surah' ? recOptions(n, prev)
        : kind === 'hq' ? `<optgroup label="${esc(t('verseByVerse'))}">${verseOptions(prev)}</optgroup>` + quarterOptions(prev)
        : verseOptions(prev);
      if (!sel.value || !L.getCollectionSync(sel.value)) sel.value = L.verseCollections[0].id;
      const pc = L.getCollectionSync(prev);
      if (pc && kind !== 'surah' && pc.kind === 'surahs') sel.value = L.verseFor(pc.style).id;
      if (pc && kind !== 'hq' && pc.kind === 'quarters') sel.value = L.verseFor(pc.style).id;
      updateRecBar();
    };
    fill();
    sel.addEventListener('change', () => { S.prefs.set('collection', sel.value); updateRecBar(); });
    if (kind === 'surah') {
      const tok = renderTok;
      L.loadMp3Quran().then(() => { if (tok === renderTok) fill(); }).catch(() => {});
    }
  }

  function viewSurah(m) {
    const n = +m[1], s = Q.surah(n);
    if (!s) return go('#/');
    const target = m[2] ? +m[2] : null;
    ctx.kind = 'surah'; ctx.n = n;
    setTop(L.surahTitle(n), true);
    const ar = lang() === 'ar';
    V().innerHTML = `<section class="reader-head">
        <div class="surah-ar" lang="ar">${esc(s.ar)}</div>
        ${ar ? '' : `<h1 class="surah-en">${esc(s.en)}</h1>`}
        <p class="surah-meta">${ar ? '' : esc(s.meaning) + ' · '}${t('ayahsN', { n: num(s.ayahs) })} · ${t(s.type)}</p>
      </section>
      ${readerControls()}
      <div id="readerBody" class="reader-body" aria-live="polite"><p class="muted center">${t('loadingText')}</p></div>
      ${pagerHTML('surah', n)}`;
    setupRecSelect('surah', n);
    loadReader('surah', n, target);
  }
  function viewPassage(m) {
    const kind = m[1], n = +m[2];
    if (n < 1 || n > Q.LIMITS[kind]) return go('#/');
    ctx.kind = kind; ctx.n = n;
    const title = L.passageTitle(kind, n);
    setTop(title, true);
    V().innerHTML = `<section class="reader-head passage">
        <h1 class="passage-title">${esc(title)}</h1><p class="surah-meta" id="passageRange">&nbsp;</p>
      </section>
      ${readerControls()}
      <div id="readerBody" class="reader-body" aria-live="polite"><p class="muted center">${t('loadingText')}</p></div>
      ${pagerHTML(kind, n)}`;
    setupRecSelect(kind, n);
    loadReader(kind, n, null);
  }
  function pagerHTML(kind, n) {
    const max = Q.LIMITS[kind];
    const label = k => kind === 'surah' ? surahName(k) : L.passageTitle(kind, k);
    return `<nav class="pager" aria-label="${t('navigation')}">
      ${n > 1 ? `<a class="btn ghost" href="#/${kind}/${n - 1}">${icon('back')}<span>${esc(label(n - 1))}</span></a>` : '<span></span>'}
      ${n < max ? `<a class="btn ghost" href="#/${kind}/${n + 1}"><span>${esc(label(n + 1))}</span>${icon('chev')}</a>` : '<span></span>'}
    </nav>`;
  }

  async function loadReader(kind, n, targetAyah) {
    const tok = renderTok;
    try {
      const p = await Q.getPassage(kind, n);
      if (tok !== renderTok) return;
      ctx.passage = p;
      p.ayahs.forEach(x => textCache.set(x.s + ':' + x.a, { text: Q.stripBasmala(x.s, x.a, x.text), tr: x.tr }));
      renderAyahs();
      if (kind !== 'surah' && p.ayahs.length) {
        const a = p.ayahs[0], b = p.ayahs[p.ayahs.length - 1];
        $('#passageRange').textContent = `${surahName(a.s)} ${num(a.a)} – ${surahName(b.s)} ${num(b.a)}`;
      }
      applyHighlight(false);
      if (targetAyah) {
        const el = document.querySelector(`[data-key="${n}:${targetAyah}"].ayah, [data-key="${n}:${targetAyah}"].ma`);
        if (el) { el.classList.add('is-target'); el.scrollIntoView({ block: 'center' }); }
      }
      updateSheetAyah();
    } catch (e) {
      if (tok !== renderTok) return;
      $('#readerBody').innerHTML = `<div class="empty"><p>${navigator.onLine ? t('errText') : t('errTextOffline')}</p>
        <button class="btn" data-act="retry">${t('retry')}</button> <a class="btn ghost" href="#/settings">${t('settings')}</a></div>`;
    }
  }

  function renderAyahs() {
    const body = $('#readerBody');
    if (!body || !ctx.passage) return;
    const mode = S.prefs.get('readMode'), showTr = S.prefs.get('showTranslation');
    const multi = ctx.kind !== 'surah';
    let html = '', lastS = null, open = false;
    ctx.passage.ayahs.forEach((x, i) => {
      if (x.s !== lastS) {
        if (open) { html += '</div>'; open = false; }
        if (multi) {
          html += `<div class="surah-divider${x.a === 1 ? '' : ' cont'}"><span lang="ar">${esc(Q.surah(x.s).ar)}</span><a href="#/surah/${x.s}/${x.a}">${esc(surahName(x.s))}</a></div>`;
        }
        if (x.a === 1 && x.s !== 1 && x.s !== 9) html += `<div class="basmala" lang="ar" dir="rtl">${Q.BASMALA}</div>`;
        lastS = x.s;
      }
      const key = x.s + ':' + x.a;
      const text = esc(Q.stripBasmala(x.s, x.a, x.text)) + (x.sajda ? ' <span class="sajda" title="' + t('sajda') + '">۩</span>' : '');
      if (mode === 'mushaf') {
        if (!open) { html += '<div class="mushaf" lang="ar" dir="rtl">'; open = true; }
        html += `<span class="ma" data-key="${key}" data-act="ayahMenu" tabindex="0" role="button" aria-label="${esc(t('ayahOptions'))} ${esc(key)}">${text} <span class="end">${endMark(x.a)}</span></span> `;
      } else {
        const fav = S.favs.has('ayah:' + key);
        html += `<article class="ayah" data-key="${key}">
          <div class="ayah-top">
            <button class="ayah-key" data-act="ayahMenu" data-key="${key}" aria-label="${esc(t('ayahOptions'))} ${esc(key)}">${num(x.s)}:${num(x.a)}</button>
            <span class="ayah-tools">
              <button class="icon-btn sm" data-act="playAyah" data-key="${key}" aria-label="${t('playFromHere')}">${icon('play')}</button>
              <button class="icon-btn sm${fav ? ' is-on' : ''}" data-act="favAyah" data-key="${key}" aria-pressed="${fav}" aria-label="${t('addFavourite')}">${icon(fav ? 'heartF' : 'heart')}</button>
            </span>
          </div>
          <p class="ar" lang="ar" dir="rtl">${text} <span class="end">${endMark(x.a)}</span></p>
          ${showTr && x.tr ? `<p class="tr">${esc(x.tr)}</p>` : ''}
        </article>`;
      }
      if (i === ctx.passage.ayahs.length - 1 && open) html += '</div>';
    });
    if (ctx.passage.offline) html += '';
    body.innerHTML = html;
    body.classList.toggle('mode-mushaf', mode === 'mushaf');
    applyHighlight(false);
  }

  let lastUserScroll = 0;
  ['wheel', 'touchmove', 'keydown'].forEach(evn => window.addEventListener(evn, () => { lastUserScroll = Date.now(); }, { passive: true }));
  function applyHighlight(scroll) {
    $$('.is-current').forEach(e => e.classList.remove('is-current'));
    const key = P.currentKey();
    if (!key) return;
    const el = document.querySelector(`.ayah[data-key="${key}"], .ma[data-key="${key}"]`);
    if (!el) return;
    el.classList.add('is-current');
    if (scroll && S.prefs.get('follow') && P.state().wanted && Date.now() - lastUserScroll > 5000 && !$('#sheet').classList.contains('open')) {
      const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      el.scrollIntoView({ block: 'center', behavior: reduce ? 'auto' : 'smooth' });
    }
  }

  function verseCollectionForReader() {
    const sel = $('#recSelect');
    let c = sel ? L.getCollectionSync(sel.value) : null;
    if (c && c.kind === 'verses') return { col: c, switched: false };
    c = L.verseFor(c && c.style === 'mujawwad' ? 'mujawwad' : 'murattal');
    return { col: c, switched: true };
  }
  function playFromAyah(key, repeatOne) {
    const { col, switched } = verseCollectionForReader();
    const [s] = key.split(':').map(Number);
    let desc;
    if (ctx.kind && ctx.kind !== 'surah' && ctx.passage && ctx.passage.ayahs.some(x => x.s + ':' + x.a === key)) desc = { type: 'passage', collectionId: col.id, kind: ctx.kind, n: ctx.n };
    else desc = { type: 'surah', collectionId: col.id, surah: s };
    if (switched) toast(t('switchedToVerse'));
    P.loadQueue([desc], 0, { autoplay: true, startKey: key, repeatOne: !!repeatOne });
  }
  function toggleFavAyah(key, btn) {
    const c = textCache.get(key) || {};
    const on = S.favs.toggle({ id: 'ayah:' + key, kind: 'ayah', key, title: keyLabel(key), text: c.text || '', tr: c.tr || '' });
    if (btn) { btn.classList.toggle('is-on', on); btn.setAttribute('aria-pressed', String(on)); btn.innerHTML = icon(on ? 'heartF' : 'heart'); }
    toast(on ? t('favAdded') : t('favRemoved'));
  }
  function ayahMenu(key) {
    const c = textCache.get(key) || {};
    const fav = S.favs.has('ayah:' + key);
    const items = [
      { label: t('playFromHere'), icon: 'play', onClick: () => playFromAyah(key, false) },
      { label: t('repeatThisAyah'), icon: 'repeat', onClick: () => playFromAyah(key, true) },
      { label: fav ? t('removeFavourite') : t('addFavourite'), icon: fav ? 'heartF' : 'heart', onClick: () => { toggleFavAyah(key, $(`.ayah[data-key="${key}"] [data-act=favAyah]`)); } },
      { label: t('copyAyah'), icon: 'copy', onClick: () => copyAyah(key, c) }
    ];
    if (ctx.kind !== 'surah') items.push({ label: t('openSurah'), icon: 'book', onClick: () => go('#/surah/' + key.replace(':', '/')) });
    actionSheet(keyLabel(key), items);
  }
  function copyAyah(key, c) {
    const txt = `${c.text || ''}\n\n${c.tr || ''}\n— ${keyLabel(key)}`;
    const done = () => toast(t('copied'));
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done, () => fallbackCopy(txt, done));
    else fallbackCopy(txt, done);
  }
  function fallbackCopy(txt, done) {
    const ta = document.createElement('textarea'); ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); done(); } catch (e) { toast(t('copyFailed')); }
    ta.remove();
  }

  // ---- Library ---------------------------------------------------------------------------
  function collectionRow(c) {
    const sub = c.kind === 'verses' ? c.credit : c.kind === 'quarters' ? L.pick(c.sub) + ' · ' + c.credit : (c.complete ? t('completeKhatma') : t('surahsN', { n: num(c.surahs.length) })) + ' · ' + c.credit;
    const search = [c.name.en, c.name.ar, c.style, sub].join(' ');
    return `<a class="row" href="#/collection/${c.id}" data-search="${esc(search)}">${cover(coverKey(c))}
      <span class="row-main"><span class="row-title">${esc(L.pick(c.name))}</span><span class="row-sub">${esc(sub)}</span></span>${icon('chev')}</a>`;
  }
  function curatedRow(c) {
    const search = [c.title.en, c.title.ar, c.note.en, c.note.ar, c.group].join(' ');
    return `<a class="row" href="#/item/${encodeURIComponent(c.identifier)}" data-search="${esc(search)}">${cover(c.group || 'archive')}
      <span class="row-main"><span class="row-title">${esc(L.pick(c.title))}</span><span class="row-sub">${esc(L.pick(c.note))}</span></span>${icon('chev')}</a>`;
  }
  function viewLibrary() {
    setTop(t('tabLibrary'), false);
    const tok = renderTok;
    V().innerHTML = `<form id="libForm" role="search"><label class="search">${icon('search')}<input id="libSearch" type="search" autocomplete="off" placeholder="${t('searchRecitations')}" aria-label="${t('searchRecitations')}"></label></form>
      <section class="lib-sec"><h2 class="sec-title">${t('verseByVerse')}</h2><p class="sec-note">${t('verseByVerseNote')}</p>
        <div class="list">${L.verseCollections.map(collectionRow).join('')}</div></section>
      <section class="lib-sec"><h2 class="sec-title">${t('arbaaKhatmas')}</h2><p class="sec-note">${t('arbaaNote')}</p>
        <div class="list">${L.quarterCollections.map(collectionRow).join('')}</div></section>
      <section class="lib-sec"><h2 class="sec-title">${t('completeRecordings')}</h2><p class="sec-note">${t('completeNote')}</p>
        <div class="list" id="mp3qList"><p class="muted">${t('loading')}</p></div></section>
      <section class="lib-sec"><h2 class="sec-title">${t('historical')}</h2><p class="sec-note">${t('historicalNote')}</p>
        <div class="preset-grid">${L.archive.presets.map(p => `<a class="preset-tile" href="#/archive?preset=${p.id}" data-search="${esc(p.name.en + ' ' + p.name.ar + ' ' + p.terms.join(' '))}">${cover(p.id)}<span>${esc(L.pick(p.name))}</span></a>`).join('')}</div>
        <h3 class="sub-title">${t('checkedItems')}</h3>
        <div class="list">${L.archive.curated.map(curatedRow).join('')}</div>
        <p class="sec-note"><a href="#/archive" class="link">${t('browseAllArchive')}</a></p>
      </section>
      <p class="empty-inline" id="libEmpty" hidden></p>`;
    const inp = $('#libSearch');
    const filter = () => {
      const q = inp.value.trim();
      const qn = Q.normalizeLatin(q), qa = Q.normalizeArabic(q);
      let shown = 0;
      $$('[data-search]', V()).forEach(el => {
        const s = el.dataset.search, ok = !q || (qn && Q.normalizeLatin(s).includes(qn)) || (qa && Q.normalizeArabic(s).includes(qa));
        el.hidden = !ok; if (ok) shown++;
      });
      const e = $('#libEmpty');
      e.hidden = !q || shown > 0;
      e.innerHTML = q ? `${esc(t('noRecMatch'))} <a class="link" href="#/archive?q=${encodeURIComponent(q)}">${esc(t('searchArchiveFor', { q }))}</a>` : '';
    };
    inp.addEventListener('input', filter);
    $('#libForm').addEventListener('submit', e => { e.preventDefault(); const q = inp.value.trim(); if (q) go('#/archive?q=' + encodeURIComponent(q)); });
    const fillMp3q = force => L.loadMp3Quran(force).then(list => {
      if (tok !== renderTok) return;
      $('#mp3qList').innerHTML = list.length ? list.map(collectionRow).join('') : `<p class="muted">${t('noneFound')}</p>`;
      filter();
    }).catch(() => {
      if (tok !== renderTok) return;
      $('#mp3qList').innerHTML = `<div class="empty small"><p>${navigator.onLine ? t('errCatalogue') : t('errOffline')}</p><button class="btn" data-act="reloadMp3q">${t('retry')}</button></div>`;
    });
    fillMp3q(false);
    ctx.reloadMp3q = () => { $('#mp3qList').innerHTML = `<p class="muted">${t('loading')}</p>`; fillMp3q(true); };
  }

  async function viewCollection(m) {
    const tok = renderTok;
    setTop(t('recitation'), true);
    V().innerHTML = `<p class="muted center">${t('loading')}</p>`;
    let c = null;
    try { c = await L.getCollection(m[1]); } catch (e) { /* handled below */ }
    if (tok !== renderTok) return;
    if (!c) {
      V().innerHTML = `<div class="empty"><p>${navigator.onLine ? t('errCatalogue') : t('errOffline')}</p><button class="btn" data-act="retry">${t('retry')}</button></div>`;
      return;
    }
    setTop(L.pick(c.name), true);
    if (c.kind === 'quarters') return renderQuarterCollection(c, tok);
    const surahs = c.kind === 'verses' ? Q.SURAHS : c.surahs.map(n => Q.surah(n)).filter(Boolean);
    const note = c.kind === 'verses' ? L.pick(c.note) : (c.complete ? t('completeCollectionNote') : t('partialCollectionNote', { n: num(c.surahs.length) }));
    V().innerHTML = `<section class="col-head">${cover(coverKey(c), 'lg')}<h1 class="h1">${esc(L.pick(c.name))}</h1>
        <p>${esc(note)}</p><p class="muted small">${t('source')}: ${esc(c.credit)}</p>
        <div class="row-actions"><button class="btn primary" data-act="playAllList">${icon('play')}<span>${t('playAll')}</span></button></div></section>
      <div class="list">${surahs.map(s => trackRow({ type: 'surah', collectionId: c.id, surah: s.n }, num(s.n) + '. ' + surahName(s.n), (lang() === 'ar' ? '' : s.ar + ' · ') + t('ayahsN', { n: num(s.ayahs) }))).join('')}</div>`;
    refreshDlStates();
  }

  async function renderQuarterCollection(c, tok) {
    V().innerHTML = `<section class="col-head">${cover(coverKey(c), 'lg')}<h1 class="h1">${esc(L.pick(c.name))}</h1><p>${esc(L.pick(c.note))}</p>
      <p class="muted small" id="qCount">${t('loading')}</p></section><div id="qList"></div>`;
    let q;
    try { q = await L.loadQuarters(c.id); }
    catch (e) {
      if (tok !== renderTok) return;
      $('#qList').innerHTML = `<div class="empty"><p>${navigator.onLine ? t('errArchive') : t('errOffline')}</p><button class="btn" data-act="retry">${t('retry')}</button></div>`;
      $('#qCount').textContent = '';
      return;
    }
    if (tok !== renderTok) return;
    $('#qCount').innerHTML = `${esc(t('quarterAvailableN', { n: num(q.count) }))} · ${t('source')}: <a class="link" href="${esc(L.archive.detailsUrl(c.identifier))}" target="_blank" rel="noopener">archive.org</a>`;
    let html = `<div class="row-actions"><button class="btn primary" data-act="playAllList">${icon('play')}<span>${t('playAll')}</span></button></div><div class="list">`;
    for (let n = 1; n <= 240; n++) {
      const f = q.map[n];
      if (f && n > 1 && q.map[n - 1] && q.map[n - 1].url === f.url) continue; // one file covering two quarters is listed once
      if (f) html += trackRow({ type: 'quarter', collectionId: c.id, n }, L.passageTitle('hq', n), f.label);
      else html += `<div class="row lost-row"><span class="row-play">${icon('close')}</span><span class="row-main"><span class="row-title">${esc(L.passageTitle('hq', n))}</span><span class="row-sub">${t('quarterLost')}</span></span></div>`;
    }
    $('#qList').innerHTML = html + '</div>';
    refreshDlStates();
  }

  async function viewArchive(m, params) {
    const presetId = params.get('preset'), q = params.get('q') || '';
    const preset = L.archive.presets.find(p => p.id === presetId);
    setTop(preset ? L.pick(preset.name) : t('internetArchive'), true);
    const tok = renderTok;
    V().innerHTML = `<form id="archForm" role="search"><label class="search">${icon('search')}<input name="q" type="search" value="${esc(q)}" autocomplete="off" placeholder="${t('searchArchive')}" aria-label="${t('searchArchive')}"></label></form>
      ${preset ? `<div class="col-head">${cover(preset.id, 'lg')}</div>` : ''}<p class="sec-note">${t('archiveDisclaimer')}</p>
      <div class="list" id="archList"><p class="muted">${t('searching')}</p></div><div id="archMore" class="center"></div>`;
    $('#archForm').addEventListener('submit', e => {
      e.preventDefault();
      const nq = e.target.q.value.trim();
      const p = new URLSearchParams(); if (presetId) p.set('preset', presetId); if (nq) p.set('q', nq);
      go('#/archive?' + p.toString());
    });
    let page = 1, shown = 0;
    const load = async () => {
      $('#archMore').innerHTML = '';
      try {
        const res = await L.archive.search({ preset: presetId, q, page });
        if (tok !== renderTok) return;
        const list = $('#archList');
        if (page === 1) list.innerHTML = '';
        if (!res.items.length && page === 1) { list.innerHTML = `<div class="empty small"><p>${t('noArchiveResults')}</p></div>`; return; }
        list.insertAdjacentHTML('beforeend', res.items.map(it => `<a class="row" href="#/item/${encodeURIComponent(it.identifier)}">${cover(presetId || 'archive')}
          <span class="row-main"><span class="row-title" dir="auto">${esc(it.title)}</span><span class="row-sub">${esc([it.date, it.downloads ? t('playsN', { n: num(it.downloads) }) : ''].filter(Boolean).join(' · '))}</span></span>${icon('chev')}</a>`).join(''));
        shown += res.items.length;
        if (shown < res.total) $('#archMore').innerHTML = `<button class="btn" data-act="archMore">${t('loadMore')}</button>`;
      } catch (e) {
        if (tok !== renderTok) return;
        $('#archList').innerHTML = `<div class="empty small"><p>${navigator.onLine ? t('errArchive') : t('errOffline')}</p><button class="btn" data-act="retry">${t('retry')}</button></div>`;
      }
    };
    ctx.archMore = () => { page++; load(); };
    load();
  }

  async function viewItem(m) {
    const id = decodeURIComponent(m[1]);
    const tok = renderTok;
    setTop(t('recording'), true);
    V().innerHTML = `<p class="muted center">${t('loading')}</p>`;
    let item;
    try { item = await L.archive.item(id); }
    catch (e) {
      if (tok !== renderTok) return;
      V().innerHTML = `<div class="empty"><p>${navigator.onLine ? t('errArchive') : t('errOffline')}</p><button class="btn" data-act="retry">${t('retry')}</button></div>`;
      return;
    }
    if (tok !== renderTok) return;
    const fav = S.favs.has('item:' + id);
    const total = item.files.reduce((a, f) => a + (f.length || 0), 0);
    const cur = L.archive.curated.find(x => x.identifier === id);
    V().innerHTML = `<section class="col-head">${cover(cur ? cur.group : 'archive', 'lg')}<h1 class="h1" dir="auto">${esc(item.title)}</h1>
      <p class="muted small">${esc([item.date, t('filesN', { n: num(item.files.length) }), total ? fmtTime(total) : ''].filter(Boolean).join(' · '))}</p>
      ${item.description ? `<p class="desc" dir="auto">${esc(item.description.slice(0, 600))}${item.description.length > 600 ? '…' : ''}</p>` : ''}
      <div class="row-actions">
        ${item.files.length ? `<button class="btn primary" data-act="playAllList">${icon('play')}<span>${t('playAll')}</span></button>` : ''}
        <button class="icon-btn${fav ? ' is-on' : ''}" data-act="favItem" data-id="${esc(id)}" data-title="${esc(item.title)}" aria-pressed="${fav}" aria-label="${t('addFavourite')}">${icon(fav ? 'heartF' : 'heart')}</button>
        <a class="btn ghost" href="${esc(L.archive.detailsUrl(id))}" target="_blank" rel="noopener">${icon('external')}<span>archive.org</span></a>
      </div></section>
      ${item.files.length ? `<div class="list">${item.files.map(f => trackRow({ type: 'archive', identifier: id, file: f.name, title: f.title, itemTitle: item.title, url: f.url }, f.title, f.length ? fmtTime(f.length) : '')).join('')}</div>`
        : `<div class="empty small"><p>${t('noAudioFiles')}</p></div>`}`;
    refreshDlStates();
  }

  // ---- Saved: favourites, playlists, downloads --------------------------------------------
  const SAVED_TABS = ['favourites', 'playlists', 'downloads'];
  async function viewSaved(m) {
    const tab = SAVED_TABS.includes(m[1]) ? m[1] : 'favourites';
    setTop(t('tabSaved'), false);
    const tok = renderTok;
    let body = '';
    if (tab === 'favourites') {
      const favs = S.favs.list();
      const tracks = favs.filter(f => f.kind === 'track'), ayahs = favs.filter(f => f.kind === 'ayah'), items = favs.filter(f => f.kind === 'item');
      if (!favs.length) body = `<div class="empty"><p>${t('noFavourites')}</p><a class="btn" href="#/">${t('browseQuran')}</a></div>`;
      if (tracks.length) body += `<h2 class="sec-title">${t('recitations')}</h2><div class="list">${tracks.map(f => trackRow(f.desc, f.title, f.subtitle)).join('')}</div>`;
      if (items.length) body += `<h2 class="sec-title">${t('recordings')}</h2><div class="list">${items.map(f => `<a class="row" href="#/item/${encodeURIComponent(f.identifier)}"><span class="row-icon">${icon('archive')}</span><span class="row-main"><span class="row-title" dir="auto">${esc(f.title)}</span><span class="row-sub">${t('internetArchive')}</span></span>${icon('chev')}</a>`).join('')}</div>`;
      if (ayahs.length) body += `<h2 class="sec-title">${t('ayahs')}</h2>` + ayahs.map(f => `<article class="ayah fav-ayah" data-key="${esc(f.key)}">
          <div class="ayah-top"><a class="ayah-key" href="#/surah/${esc(f.key.replace(':', '/'))}">${esc(keyLabel(f.key))}</a>
          <span class="ayah-tools"><button class="icon-btn sm" data-act="unfav" data-id="${esc(f.id)}" aria-label="${t('removeFavourite')}">${icon('trash')}</button></span></div>
          ${f.text ? `<p class="ar" lang="ar" dir="rtl">${esc(f.text)}</p>` : ''}${f.tr && S.prefs.get('showTranslation') ? `<p class="tr">${esc(f.tr)}</p>` : ''}</article>`).join('');
    } else if (tab === 'playlists') {
      const lists = S.playlists.list();
      body = `<div class="row-actions"><button class="btn primary" data-act="newPlaylist">${icon('plus')}<span>${t('newPlaylist')}</span></button></div>` +
        (lists.length ? `<div class="list">${lists.map(p => `<a class="row" href="#/playlist/${p.id}"><span class="row-icon">${icon('listPlus')}</span><span class="row-main"><span class="row-title" dir="auto">${esc(p.name)}</span><span class="row-sub">${t('itemsN', { n: num(p.items.length) })}</span></span>${icon('chev')}</a>`).join('')}</div>`
          : `<div class="empty small"><p>${t('noPlaylists')}</p></div>`);
    } else {
      const [list, use] = await Promise.all([O.list(), O.usage()]);
      if (tok !== renderTok) return;
      body = `<p class="sec-note">${t('downloadsNote')}</p><p class="usage">${t('usage', { used: fmtBytes(use.saved) })}${use.quota ? ' · ' + t('available', { q: fmtBytes(use.quota) }) : ''}</p>` +
        (list.length ? `<div class="list">${list.map(d => trackRow(d.desc, d.title, d.subtitle + ' · ' + fmtBytes(d.size))).join('')}</div>
          <div class="row-actions"><button class="btn danger ghost" data-act="removeAllDownloads">${icon('trash')}<span>${t('removeAllDownloads')}</span></button></div>`
          : `<div class="empty small"><p>${t('noDownloads')}</p></div>`);
    }
    V().innerHTML = `<div class="seg" role="tablist">${SAVED_TABS.map(k => `<a role="tab" class="seg-btn" href="#/saved/${k}" aria-selected="${k === tab}">${t('saved_' + k)}</a>`).join('')}</div><div class="saved-body">${body}</div>`;
    refreshDlStates();
  }

        <div class="set-row col"><span class="set-label">${t('audioDownloads')}</span><p class="set-note" id="usageNote">${t('loading')}</p>
          <div><a class="btn ghost" href="#/saved/downloads">${t('manageDownloads')}</a></div></div>
      </section>
      <section class="set-sec"><h2 class="sec-title">${t('app')}</h2>

        <div class="set-row col"><span class="set-label">${t('sources')}</span>
          <ul class="sources">
            <li>${t('srcText')}: <a class="link" href="https://alquran.cloud" target="_blank" rel="noopener">AlQuran Cloud</a> (Tanzil)</li>

            <li>${t('srcComplete')}: <a class="link" href="https://mp3quran.net" target="_blank" rel="noopener">mp3quran.net</a></li>
            <li>${t('srcArchive')}: <a class="link" href="https://archive.org" target="_blank" rel="noopener">Internet Archive</a></li>

    $('#fontSel').onchange = e => { pr.set('quranFont', e.target.value); applyAppearance(); };
